<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI English Tutor - Fixed Version</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #FDFCFB; touch-action: manipulation; }
        .chat-container { height: calc(100vh - 280px); overflow-y: auto; padding-bottom: 20px; }
        .rounded-tl-sm { border-top-left-radius: 4px !important; }
        .rounded-tr-sm { border-top-right-radius: 4px !important; }
        .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // ĐÃ DÁN KEY CỦA BẠN TẠI ĐÂY
        const GEMINI_API_KEY = "AIzaSyBMox0NFLIN1xZtPJbcqoT2YeCeFAoMh30"; 

        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [messages, setMessages] = useState([
                { id: 1, role: 'ai', text: "Hello! I'm your English tutor. How's your day going?", vi: "Chào bạn! Tôi là trợ lý tiếng Anh. Ngày hôm nay của bạn thế nào?" }
            ]);
            const [isListening, setIsListening] = useState(false);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [suggestions, setSuggestions] = useState(["I'm doing well!", "I had a busy day"]);
            const messagesEndRef = useRef(null);

            useEffect(() => { 
                messagesEndRef.current?.scrollIntoView({ behavior: "smooth" }); 
                if(window.lucide) window.lucide.createIcons();
            }, [messages]);

            const speak = (t) => {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(t);
                u.lang = 'en-US'; u.rate = 0.85;
                window.speechSynthesis.speak(u);
            };

            const callGemini = async (input) => {
                // Sử dụng API v1 ổn định hơn cho Mobile
                const url = `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `You are a patient English tutor. Respond to student: "${input}". 
                        Format strictly as JSON: {"en": "reply text", "vi": "translation", "tip": "advice", "sug": ["2 options"]}` }] }],
                        generationConfig: { responseMimeType: "application/json", temperature: 0.7 }
                    })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error?.message || "Lỗi API");
                }

                const data = await response.json();
                return JSON.parse(data.candidates[0].content.parts[0].text);
            };

            const handleAction = async (text) => {
                if (!text.trim() || loading) return;
                const userMsg = { id: Date.now(), role: 'user', text: text };
                setMessages(prev => [...prev, userMsg]);
                setLoading(true); setError(null);

                try {
                    const res = await callGemini(text);
                    const aiMsg = { 
                        id: Date.now() + 1, 
                        role: 'ai', 
                        text: res.en, 
                        vi: res.vi,
                        tip: res.tip 
                    };
                    setMessages(prev => [...prev, aiMsg]);
                    if (res.sug) setSuggestions(res.sug);
                    speak(res.en);
                } catch (err) {
                    setError("Lỗi: " + err.message + ". Hãy kiểm tra kết nối mạng.");
                } finally {
                    setLoading(false);
                }
            };

            const toggleMic = () => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) return alert("Vui lòng dùng Safari trên iPhone!");

                const recognition = new SpeechRecognition();
                recognition.lang = 'en-US';
                recognition.onstart = () => setIsListening(true);
                recognition.onresult = (e) => {
                    const text = e.results[0][0].transcript;
                    if (e.results[0].isFinal) handleAction(text);
                };
                recognition.onend = () => setIsListening(false);
                recognition.start();
            };

            return (
                <div className="flex flex-col h-screen max-w-2xl mx-auto bg-white shadow-2xl safe-area-bottom">
                    <header className="p-4 bg-orange-500 text-white flex justify-between items-center shadow-lg">
                        <div className="flex items-center gap-2">
                            <i data-lucide="mic" className="w-6 h-6"></i>
                            <h1 className="font-bold text-[17px]">AI Voice Tutor</h1>
                        </div>
                        <button onClick={() => window.location.reload()}><i data-lucide="refresh-cw" className="w-5 h-5"></i></button>
                    </header>

                    <div className="flex-1 p-4 space-y-4 chat-container">
                        {messages.map(m => (
                            <div key={m.id} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[85%] p-4 rounded-3xl shadow-sm ${m.role === 'user' ? 'bg-orange-500 text-white rounded-tr-sm' : 'bg-gray-100 text-gray-800 rounded-tl-sm'}`}>
                                    <p className="text-[15px] font-medium leading-relaxed">{m.text}</p>
                                    {m.vi && <p className="text-xs mt-2 opacity-60 border-t border-gray-300 pt-2 italic">{m.vi}</p>}
                                    {m.tip && <div className="mt-2 text-[11px] text-blue-600 font-bold">💡 {m.tip}</div>}
                                </div>
                            </div>
                        ))}
                        {loading && <div className="text-[11px] text-gray-400 italic animate-pulse px-2">AI is thinking...</div>}
                        {error && <div className="p-3 bg-red-100 text-red-600 rounded-2xl text-[11px] border border-red-200">{error}</div>}
                        <div ref={messagesEndRef} />
                    </div>

                    <footer className="p-4 bg-white border-t space-y-4 shadow-inner">
                        <div className="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                            {suggestions.map((s, i) => (
                                <button key={i} onClick={() => handleAction(s)} className="flex-shrink-0 text-[12px] py-2 px-4 bg-orange-50 text-orange-600 border border-orange-100 rounded-full active:bg-orange-200">
                                    {s}
                                </button>
                            ))}
                        </div>
                        <div className="flex justify-center pb-2">
                            <button onClick={toggleMic} className={`w-16 h-16 rounded-full flex items-center justify-center shadow-xl transition-all ${isListening ? 'bg-red-500 scale-110' : 'bg-orange-500'}`}>
                                <i data-lucide={isListening ? "square" : "mic"} className="text-white w-7 h-7"></i>
                            </button>
                        </div>
                        {isListening && <p className="text-center text-red-500 text-[11px] font-bold animate-pulse">Lắng nghe: Speak now...</p>}
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        setTimeout(() => { if(window.lucide) window.lucide.createIcons(); }, 300);
    </script>
</body>
</html>
