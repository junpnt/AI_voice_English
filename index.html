<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Voice Tutor - iPhone Fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #FDFCFB; touch-action: manipulation; }
        .chat-container { height: calc(100vh - 280px); overflow-y: auto; }
        .rounded-tl-sm { border-top-left-radius: 4px !important; }
        .rounded-tr-sm { border-top-right-radius: 4px !important; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // API KEY CỦA BẠN
        const KEY = "AIzaSyBMox0NFLIN1xZtPJbcqoT2YeCeFAoMh30"; 

        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [msgs, setMsgs] = useState([
                { id: 1, role: 'ai', text: "Hello! Let's practice English. How are you today?", vi: "Chào bạn! Cùng luyện tiếng Anh nhé. Hôm nay bạn thế nào?" }
            ]);
            const [isMic, setIsMic] = useState(false);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [sugs, setSugs] = useState(["I'm good, thanks!", "I had a busy day"]);
            const endRef = useRef(null);

            useEffect(() => { 
                endRef.current?.scrollIntoView({ behavior: "smooth" }); 
                if(window.lucide) window.lucide.createIcons();
            }, [msgs]);

            const speak = (t) => {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(t);
                u.lang = 'en-US'; u.rate = 0.85;
                window.speechSynthesis.speak(u);
            };

            const askAI = async (input) => {
                // Fix lỗi ResponseMimeType bằng cách dùng v1beta và snake_case chuẩn REST
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${KEY}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ 
                            parts: [{ 
                                text: `You are an English tutor. Reply to: "${input}". 
                                Return STRICT JSON: {"en": "reply", "vi": "dịch", "tip": "advice", "sugs": ["option1", "option2"]}` 
                            }] 
                        }],
                        generation_config: { 
                            response_mime_type: "application/json", 
                            temperature: 0.7 
                        }
                    })
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error?.message || "Lỗi kết nối");
                }

                const data = await response.json();
                return JSON.parse(data.candidates[0].content.parts[0].text);
            };

            const handleSend = async (val) => {
                if (!val.trim() || loading) return;
                setMsgs(p => [...p, { id: Date.now(), role: 'user', text: val }]);
                setLoading(true); setError(null);

                try {
                    const res = await askAI(val);
                    setMsgs(p => [...p, { id: Date.now()+1, role: 'ai', text: res.en, vi: res.vi, tip: res.tip }]);
                    if (res.sugs) setSugs(res.sugs);
                    speak(res.en);
                } catch (e) {
                    setError("Lỗi: " + e.message);
                } finally {
                    setLoading(false);
                }
            };

            const toggleMic = () => {
                const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!Rec) return alert("Vui lòng dùng Safari!");

                const rec = new Rec();
                rec.lang = 'en-US';
                rec.onstart = () => setIsMic(true);
                rec.onresult = (e) => {
                    const t = e.results[0][0].transcript;
                    if (e.results[0].isFinal) handleSend(t);
                };
                rec.onend = () => setIsMic(false);
                rec.start();
            };

            return (
                <div className="flex flex-col h-screen max-w-2xl mx-auto bg-white shadow-2xl pb-10">
                    <header className="p-4 bg-orange-500 text-white flex justify-between items-center">
                        <h1 className="font-bold flex items-center gap-2">
                            <i data-lucide="mic" className="w-5 h-5"></i> AI English Tutor
                        </h1>
                        <button onClick={() => window.location.reload()}><i data-lucide="refresh-cw" className="w-4 h-4"></i></button>
                    </header>

                    <div className="flex-1 p-4 space-y-4 chat-container">
                        {msgs.map(m => (
                            <div key={m.id} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[85%] p-4 rounded-3xl ${m.role === 'user' ? 'bg-orange-500 text-white' : 'bg-gray-100 text-gray-800'}`}>
                                    <p className="text-[15px] font-medium">{m.text}</p>
                                    {m.vi && <p className="text-xs mt-1 opacity-60 italic">{m.vi}</p>}
                                    {m.tip && <div className="mt-1 text-[10px] text-blue-600 font-bold">💡 {m.tip}</div>}
                                </div>
                            </div>
                        ))}
                        {loading && <div className="text-[11px] text-gray-400 italic">AI is thinking...</div>}
                        {error && <div className="p-3 bg-red-100 text-red-600 rounded-2xl text-[10px]">{error}</div>}
                        <div ref={endRef} />
                    </div>

                    <footer className="p-4 bg-white border-t space-y-4">
                        <div className="flex gap-2 overflow-x-auto no-scrollbar">
                            {sugs.map((s, i) => (
                                <button key={i} onClick={() => handleSend(s)} className="flex-shrink-0 text-[12px] py-2 px-4 bg-orange-50 text-orange-600 border border-orange-100 rounded-full active:bg-orange-200">
                                    {s}
                                </button>
                            ))}
                        </div>
                        <div className="flex justify-center">
                            <button onClick={toggleMic} className={`w-16 h-16 rounded-full flex items-center justify-center shadow-xl ${isMic ? 'bg-red-500 scale-110' : 'bg-orange-500'}`}>
                                <i data-lucide={isMic ? "square" : "mic"} className="text-white w-7 h-7"></i>
                            </button>
                        </div>
                        {isMic && <p className="text-center text-red-500 text-[11px] font-bold animate-pulse">Listening...</p>}
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
