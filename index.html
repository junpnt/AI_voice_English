<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Voice Tutor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #fff8f5;
            /* FIX iOS: dùng dvh thay vì vh để tránh lỗi address bar */
            height: 100dvh;
            overflow: hidden;
            touch-action: manipulation;
        }
        #root { height: 100%; }
        .app-shell {
            display: flex;
            flex-direction: column;
            /* FIX iOS: dùng 100dvh */
            height: 100dvh;
            max-width: 480px;
            margin: 0 auto;
            background: #fff;
        }
        .chat-area {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        /* Tắt scrollbar nhưng vẫn scroll được */
        .chat-area::-webkit-scrollbar { display: none; }
        .no-sb::-webkit-scrollbar { display: none; }

        /* Mic pulse animation */
        @keyframes pulse-ring {
            0% { transform: scale(1); opacity: 0.7; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        .mic-pulse::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: #ef4444;
            animation: pulse-ring 1s ease-out infinite;
        }
        .mic-pulse { position: relative; }

        /* FIX iOS: input không bị zoom khi focus */
        input[type="text"] { font-size: 16px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // ⚠️ Lưu ý: Đặt API key trực tiếp trong HTML là không an toàn nếu public.
        // Chỉ dùng cho localhost / nội bộ.
        const API_KEY = "AIzaSyBMox0NFLIN1xZtPJbcqoT2YeCeFAoMh30";

        const { useState, useEffect, useRef, useCallback } = React;

        // =============================================
        // FIX 1: Unlock iOS Speech Synthesis
        // iOS chỉ cho phép speak() trong user gesture.
        // Gọi một utterance rỗng ngay khi user tap lần đầu.
        // =============================================
        let speechUnlocked = false;
        function unlockSpeech() {
            if (speechUnlocked) return;
            const u = new SpeechSynthesisUtterance('');
            u.volume = 0;
            window.speechSynthesis.speak(u);
            speechUnlocked = true;
        }

        function speak(text) {
            if (!text) return;
            window.speechSynthesis.cancel();
            // Delay nhỏ giúp iOS xử lý ổn định hơn
            setTimeout(() => {
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'en-US';
                u.rate = 0.85;
                u.pitch = 1;
                window.speechSynthesis.speak(u);
            }, 100);
        }

        // =============================================
        // Gọi Gemini API
        // =============================================
        async function callGemini(input) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`;
            const prompt = `You are a friendly English tutor for Vietnamese learners.
Reply to the student's message below.
IMPORTANT: Return ONLY a raw JSON object. No markdown, no code blocks, no extra text.
Format: {"en":"<your English reply>","vi":"<Vietnamese translation of your reply>","tip":"<one short grammar/vocab tip in Vietnamese>","sug":["<suggestion 1>","<suggestion 2>"]}
Student message: "${input}"`;

            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: { temperature: 0.7, maxOutputTokens: 400 }
                })
            });

            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err?.error?.message || `HTTP ${res.status}`);
            }

            const data = await res.json();
            let raw = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
            // Dọn markdown nếu AI vẫn trả về
            raw = raw.replace(/```json\s*/gi, '').replace(/```/g, '').trim();
            return JSON.parse(raw);
        }

        // =============================================
        // Component chính
        // =============================================
        const App = () => {
            const [messages, setMessages] = useState([
                { id: 1, role: 'ai', en: "Hello! I'm your AI English tutor. Let's practice! How are you today?", vi: "Xin chào! Tôi là gia sư AI của bạn. Cùng luyện tập nhé! Hôm nay bạn thế nào?" }
            ]);
            const [inputText, setInputText] = useState('');
            const [isMic, setIsMic] = useState(false);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [suggs, setSuggs] = useState(["I'm fine, thank you!", "I feel great today!"]);
            const endRef = useRef(null);
            const recRef = useRef(null);
            const inputRef = useRef(null);

            useEffect(() => {
                endRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages, loading]);

            const send = useCallback(async (val) => {
                const trimmed = (val || inputText).trim();
                if (!trimmed || loading) return;
                unlockSpeech(); // FIX iOS speech synthesis
                setInputText('');
                setError(null);
                setMessages(prev => [...prev, { id: Date.now(), role: 'user', en: trimmed }]);
                setLoading(true);

                try {
                    const res = await callGemini(trimmed);
                    setMessages(prev => [...prev, {
                        id: Date.now() + 1,
                        role: 'ai',
                        en: res.en,
                        vi: res.vi,
                        tip: res.tip
                    }]);
                    if (res.sug && res.sug.length) setSuggs(res.sug);
                    speak(res.en);
                } catch (e) {
                    setError('Lỗi: ' + e.message);
                } finally {
                    setLoading(false);
                }
            }, [inputText, loading]);

            // =============================================
            // FIX 2: Speech Recognition cho iOS Safari
            // - Phải HTTPS (hoặc localhost) mới chạy được
            // - Xử lý lỗi rõ ràng từng loại
            // =============================================
            const startMic = useCallback(() => {
                unlockSpeech();
                const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;

                if (!Rec) {
                    setError('Trình duyệt không hỗ trợ nhận giọng nói. Dùng Safari trên iOS 14.5+ hoặc Chrome.');
                    return;
                }

                // Dừng nếu đang chạy
                if (recRef.current && isMic) {
                    recRef.current.stop();
                    return;
                }

                const rec = new Rec();
                recRef.current = rec;
                rec.lang = 'en-US';
                rec.continuous = false;
                rec.interimResults = false;
                rec.maxAlternatives = 1;

                rec.onstart = () => { setIsMic(true); setError(null); };

                rec.onresult = (e) => {
                    const transcript = e.results[0][0].transcript;
                    send(transcript);
                };

                rec.onerror = (e) => {
                    setIsMic(false);
                    const msgs = {
                        'not-allowed': 'Bạn chưa cho phép microphone. Vào Settings > Safari > Microphone.',
                        'no-speech': 'Không nghe thấy gì. Thử lại nhé!',
                        'network': 'Lỗi mạng khi nhận dạng giọng nói.',
                        'audio-capture': 'Không truy cập được microphone.',
                    };
                    setError(msgs[e.error] || `Lỗi mic: ${e.error}`);
                };

                rec.onend = () => { setIsMic(false); };

                try {
                    rec.start();
                } catch (e) {
                    setError('Không khởi động được mic: ' + e.message);
                    setIsMic(false);
                }
            }, [isMic, send]);

            const handleKeyDown = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    send();
                }
            };

            // SVG Icons (không dùng Lucide CDN để tránh lỗi render)
            const MicIcon = () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/>
                </svg>
            );
            const StopIcon = () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
                    <rect x="6" y="6" width="12" height="12" rx="2"/>
                </svg>
            );
            const SendIcon = () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
                </svg>
            );
            const SpeakerIcon = () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                </svg>
            );

            return (
                <div className="app-shell" style={{ boxShadow: '0 0 40px rgba(0,0,0,0.08)' }}>
                    {/* Header */}
                    <div style={{ background: 'linear-gradient(135deg, #f97316, #ea580c)', padding: '14px 16px', borderRadius: '0 0 20px 20px', boxShadow: '0 4px 20px rgba(249,115,22,0.4)' }}>
                        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                                <div style={{ background: 'rgba(255,255,255,0.2)', borderRadius: '50%', width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 18 }}>🎓</div>
                                <div>
                                    <div style={{ color: '#fff', fontWeight: 700, fontSize: 16, letterSpacing: '-0.3px' }}>AI TUTOR PRO</div>
                                    <div style={{ color: 'rgba(255,255,255,0.75)', fontSize: 11 }}>Luyện tiếng Anh cùng AI</div>
                                </div>
                            </div>
                            <button onClick={() => { window.speechSynthesis.cancel(); window.location.reload(); }}
                                style={{ background: 'rgba(255,255,255,0.2)', border: 'none', borderRadius: '50%', width: 34, height: 34, color: '#fff', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 16 }}>
                                ↺
                            </button>
                        </div>
                    </div>

                    {/* Chat area */}
                    <div className="chat-area">
                        {messages.map(m => (
                            <div key={m.id} style={{ display: 'flex', justifyContent: m.role === 'user' ? 'flex-end' : 'flex-start' }}>
                                <div style={{
                                    maxWidth: '84%',
                                    padding: '12px 16px',
                                    borderRadius: m.role === 'user' ? '20px 20px 4px 20px' : '20px 20px 20px 4px',
                                    background: m.role === 'user' ? 'linear-gradient(135deg,#f97316,#ea580c)' : '#f3f4f6',
                                    color: m.role === 'user' ? '#fff' : '#1f2937',
                                    boxShadow: m.role === 'user' ? '0 4px 12px rgba(249,115,22,0.3)' : '0 2px 8px rgba(0,0,0,0.06)',
                                }}>
                                    <div style={{ display: 'flex', alignItems: 'flex-start', gap: 6 }}>
                                        <p style={{ fontSize: 15, fontWeight: 500, flex: 1, margin: 0, lineHeight: 1.5 }}>{m.en}</p>
                                        {m.role === 'ai' && (
                                            <button onClick={() => speak(m.en)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#f97316', padding: '2px', flexShrink: 0 }}>
                                                <SpeakerIcon />
                                            </button>
                                        )}
                                    </div>
                                    {m.vi && (
                                        <p style={{ fontSize: 12, opacity: 0.6, margin: '6px 0 0', borderTop: '1px solid rgba(0,0,0,0.08)', paddingTop: 6, fontStyle: 'italic', lineHeight: 1.4 }}>
                                            {m.vi}
                                        </p>
                                    )}
                                    {m.tip && (
                                        <div style={{ marginTop: 8, fontSize: 11, color: '#2563eb', background: '#eff6ff', padding: '6px 10px', borderRadius: 10, lineHeight: 1.5, display: 'flex', gap: 4, alignItems: 'flex-start' }}>
                                            <span>💡</span> <span>{m.tip}</span>
                                        </div>
                                    )}
                                </div>
                            </div>
                        ))}

                        {loading && (
                            <div style={{ display: 'flex', gap: 5, padding: '10px 16px', background: '#f3f4f6', borderRadius: '20px 20px 20px 4px', width: 'fit-content' }}>
                                {[0,1,2].map(i => (
                                    <div key={i} style={{ width: 8, height: 8, borderRadius: '50%', background: '#f97316', animation: `bounce 1.2s ${i * 0.2}s ease-in-out infinite` }}></div>
                                ))}
                            </div>
                        )}

                        {error && (
                            <div style={{ background: '#fef2f2', color: '#dc2626', border: '1px solid #fecaca', borderRadius: 12, padding: '10px 14px', fontSize: 12, lineHeight: 1.5 }}>
                                ⚠️ {error}
                            </div>
                        )}

                        <div ref={endRef} style={{ height: 4 }} />
                    </div>

                    {/* Footer */}
                    <div style={{ background: '#fff', borderTop: '1px solid #f3f4f6', padding: '10px 16px 16px', borderRadius: '20px 20px 0 0', boxShadow: '0 -4px 20px rgba(0,0,0,0.05)' }}>
                        {/* Suggestions */}
                        <div className="no-sb" style={{ display: 'flex', gap: 8, overflowX: 'auto', paddingBottom: 10 }}>
                            {suggs.map((s, i) => (
                                <button key={i} onClick={() => { unlockSpeech(); send(s); }} disabled={loading}
                                    style={{ whiteSpace: 'nowrap', fontSize: 12, padding: '7px 14px', background: '#fff7ed', color: '#c2410c', border: '1px solid #fed7aa', borderRadius: 20, cursor: 'pointer', fontWeight: 600, flexShrink: 0, opacity: loading ? 0.5 : 1 }}>
                                    {s}
                                </button>
                            ))}
                        </div>

                        {/* FIX 3: Thêm text input */}
                        <div style={{ display: 'flex', gap: 10, alignItems: 'center', marginBottom: 14 }}>
                            <input
                                ref={inputRef}
                                type="text"
                                value={inputText}
                                onChange={e => setInputText(e.target.value)}
                                onKeyDown={handleKeyDown}
                                onFocus={() => unlockSpeech()}
                                placeholder="Hoặc gõ tiếng Anh ở đây..."
                                disabled={loading}
                                style={{
                                    flex: 1, padding: '11px 16px', borderRadius: 24, border: '1.5px solid #fed7aa',
                                    background: '#fff7ed', fontSize: 15, outline: 'none', color: '#1f2937',
                                    opacity: loading ? 0.6 : 1
                                }}
                            />
                            <button onClick={() => send()} disabled={loading || !inputText.trim()}
                                style={{ width: 44, height: 44, borderRadius: '50%', background: inputText.trim() ? 'linear-gradient(135deg,#f97316,#ea580c)' : '#e5e7eb', border: 'none', cursor: inputText.trim() ? 'pointer' : 'default', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#fff', flexShrink: 0 }}>
                                <SendIcon />
                            </button>
                        </div>

                        {/* Mic button */}
                        <div style={{ display: 'flex', justifyContent: 'center' }}>
                            <button onClick={startMic}
                                className={isMic ? 'mic-pulse' : ''}
                                style={{
                                    width: 72, height: 72, borderRadius: '50%', border: 'none', cursor: 'pointer',
                                    background: isMic ? '#ef4444' : 'linear-gradient(135deg,#f97316,#ea580c)',
                                    color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center',
                                    boxShadow: isMic ? '0 0 0 4px rgba(239,68,68,0.2)' : '0 8px 24px rgba(249,115,22,0.4)',
                                    transform: isMic ? 'scale(1.1)' : 'scale(1)',
                                    transition: 'all 0.2s ease',
                                }}>
                                {isMic ? <StopIcon /> : <MicIcon />}
                            </button>
                        </div>
                        {isMic && <p style={{ textAlign: 'center', fontSize: 12, color: '#ef4444', marginTop: 6, fontWeight: 600 }}>🎙️ Đang nghe... Nói tiếng Anh</p>}
                    </div>
                </div>
            );
        };

        // CSS animation cho loading dots
        const style = document.createElement('style');
        style.textContent = `@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }`;
        document.head.appendChild(style);

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
