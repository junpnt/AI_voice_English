<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI English Voice Tutor - Fixed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #FDFCFB; -webkit-tap-highlight-color: transparent; }
        .chat-box { height: calc(100vh - 260px); overflow-y: auto; }
        .rounded-chat { border-radius: 1.25rem; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const API_KEY = "AIzaSyBMox0NFLIN1xZtPJbcqoT2YeCeFAoMh30"; 

        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [messages, setMessages] = useState([
                { id: 1, role: 'ai', text: "Hello! I'm your English tutor. How's it going?", vi: "Chào bạn! Cùng luyện tiếng Anh nhé. Mọi chuyện thế nào rồi?" }
            ]);
            const [isMic, setIsMic] = useState(false);
            const [loading, setLoading] = useState(false);
            const [suggestions, setSuggestions] = useState(["I'm fine, thanks!", "I'm a bit tired"]);
            const [error, setError] = useState(null);
            const endRef = useRef(null);

            useEffect(() => { 
                endRef.current?.scrollIntoView({ behavior: "smooth" }); 
                if(window.lucide) window.lucide.createIcons();
            }, [messages]);

            const speak = (txt) => {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(txt);
                u.lang = 'en-US'; u.rate = 0.8;
                window.speechSynthesis.speak(u);
            };

            const callAI = async (input) => {
                // Sử dụng v1 + gemini-1.5-flash (tên chuẩn nhất)
                const url = `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `You are an English tutor. User: "${input}". 
                        Reply in JSON format only: {"en": "your reply", "vi": "tiếng Việt", "tip": "grammar tip", "sug": ["2 answer options"]}` }] }]
                    })
                });

                if (!response.ok) throw new Error("Cảnh báo: Kiểm tra lại API Key hoặc kết nối mạng.");

                const data = await response.json();
                const rawText = data.candidates[0].content.parts[0].text;
                // Xử lý chuỗi JSON nếu AI trả về có kèm ký tự ```json
                const jsonStr = rawText.replace(/```json/g, "").replace(/```/g, "").trim();
                return JSON.parse(jsonStr);
            };

            const handleSend = async (val) => {
                if (!val.trim() || loading) return;
                setMessages(p => [...p, { id: Date.now(), role: 'user', text: val }]);
                setLoading(true); setError(null);

                try {
                    const result = await callAI(val);
                    setMessages(p => [...p, { id: Date.now()+1, role: 'ai', text: result.en, vi: result.vi, tip: result.tip }]);
                    setSuggestions(result.sug || []);
                    speak(result.en);
                } catch (e) {
                    setError("Lỗi: Không tìm thấy Model hoặc API Key sai. Hãy thử lại.");
                } finally {
                    setLoading(false);
                }
            };

            const toggleMic = () => {
                const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!Rec) return alert("Vui lòng mở bằng Safari trên iPhone!");

                const rec = new Rec();
                rec.lang = 'en-US';
                rec.onstart = () => setIsMic(true);
                rec.onresult = (e) => {
                    const t = e.results[0][0].transcript;
                    if (e.results[0].isFinal) handleSend(t);
                };
                rec.onend = () => setIsMic(false);
                rec.start();
            };

            return (
                <div className="flex flex-col h-screen max-w-lg mx-auto bg-white shadow-2xl">
                    <header className="p-4 bg-orange-600 text-white flex justify-between items-center shadow-md">
                        <h1 className="font-bold tracking-tight">AI VOICE TUTOR</h1>
                        <button onClick={() => window.location.reload()}><i data-lucide="refresh-cw" className="w-5 h-5"></i></button>
                    </header>

                    <div className="flex-1 p-4 space-y-4 chat-box">
                        {messages.map(m => (
                            <div key={m.id} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`p-4 rounded-chat max-w-[85%] shadow-sm ${m.role === 'user' ? 'bg-orange-500 text-white' : 'bg-gray-100 text-gray-800 border'}`}>
                                    <p className="text-[15px] font-medium leading-relaxed">{m.text}</p>
                                    {m.vi && <p className="text-[11px] opacity-60 mt-1 border-t pt-1 border-gray-300 italic">{m.vi}</p>}
                                    {m.tip && <div className="mt-1 text-[10px] text-blue-600 font-bold bg-blue-50 p-1 rounded">💡 {m.tip}</div>}
                                </div>
                            </div>
                        ))}
                        {loading && <div className="text-gray-400 text-[11px] px-2 italic">AI is speaking...</div>}
                        {error && <div className="p-3 bg-red-50 text-red-600 rounded-xl text-[10px] border border-red-100">{error}</div>}
                        <div ref={endRef} />
                    </div>

                    <footer className="p-4 bg-white border-t border-gray-100 space-y-4">
                        <div className="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                            {suggestions.map((s, i) => (
                                <button key={i} onClick={() => handleSend(s)} className="flex-shrink-0 text-[11px] py-1.5 px-3 bg-orange-50 text-orange-700 border border-orange-100 rounded-full active:bg-orange-200">
                                    {s}
                                </button>
                            ))}
                        </div>
                        <div className="flex justify-center pb-4">
                            <button onClick={toggleMic} className={`w-16 h-16 rounded-full flex items-center justify-center shadow-xl transition-all ${isMic ? 'bg-red-500 scale-105' : 'bg-orange-500'}`}>
                                <i data-lucide={isMic ? "square" : "mic"} className="text-white w-7 h-7"></i>
                            </button>
                        </div>
                        {isMic && <p className="text-center text-red-500 text-[10px] font-bold animate-pulse">LISTENING...</p>}
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
