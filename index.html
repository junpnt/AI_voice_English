<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Tutor - Stable Version</title>
    <!-- Thư viện giao diện chính -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #FDFCFB; }
        .chat-container::-webkit-scrollbar { width: 4px; }
        .chat-container::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 10px; }
        .rounded-tl-sm { border-top-left-radius: 4px !important; }
        .rounded-tr-sm { border-top-right-radius: 4px !important; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Script điều khiển chính -->
    <script type="text/babel">
        // === NHẬP API KEY CỦA BẠN VÀO ĐÂY ===
        const GEMINI_API_KEY = "AIzaSyBMox0NFLIN1xZtPJbcqoT2YeCeFAoMh30"; 

        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [messages, setMessages] = useState([
                { id: '1', role: 'assistant', text: "Hello! I'm your AI English tutor. Let's practice talking! How was your day today?", translate: "Chào bạn! Tôi là trợ lý tiếng Anh. Hôm nay của bạn thế nào?" }
            ]);
            const [isListening, setIsListening] = useState(false);
            const [isProcessing, setIsProcessing] = useState(false);
            const [transcript, setTranscript] = useState('');
            const [suggestions, setSuggestions] = useState(["I am fine, thank you!", "I had a very busy day", "I stayed at home"]);
            const [error, setError] = useState(null);
            
            const messagesEndRef = useRef(null);
            const recognitionRef = useRef(null);

            // Tự động cuộn xuống khi có tin nhắn mới
            useEffect(() => {
                messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
                // Cập nhật icon Lucide mỗi khi render tin nhắn mới
                if (window.lucide) window.lucide.createIcons();
            }, [messages]);

            const speakText = (text) => {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.8;
                window.speechSynthesis.speak(utterance);
            };

            const callAI = async (userInput, chatHistory) => {
                try {
                    // Sử dụng fetch trực tiếp để tránh lỗi import module
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `You are a patient English tutor. Help the student practice. Student said: "${userInput}". Respond with a JSON: {"reply": "English reply", "vi": "translation in Vietnamese", "advice": "grammar advice or null", "suggestions": ["3 short answers"]}` }] }],
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    });
                    const data = await response.json();
                    const result = JSON.parse(data.candidates[0].content.parts[0].text);
                    return result;
                } catch (err) {
                    throw new Error("Không thể kết nối AI. Hãy kiểm tra API Key.");
                }
            };

            const handleSend = async (text) => {
                if (!text.trim() || isProcessing) return;
                
                const userMsg = { id: Date.now(), role: 'user', text: text };
                setMessages(prev => [...prev, userMsg]);
                setIsProcessing(true);
                setError(null);

                try {
                    const aiResult = await callAI(text, messages);
                    const assistantMsg = { 
                        id: Date.now() + 1, 
                        role: 'assistant', 
                        text: aiResult.reply, 
                        translate: aiResult.vi,
                        advice: aiResult.advice
                    };
                    setMessages(prev => [...prev, assistantMsg]);
                    setSuggestions(aiResult.suggestions || []);
                    speakText(aiResult.reply);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setIsProcessing(false);
                }
            };

            const toggleMic = () => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    alert("Trình duyệt không hỗ trợ nhận diện giọng nói. Hãy dùng Safari (iPhone) hoặc Chrome.");
                    return;
                }

                if (isListening) {
                    recognitionRef.current.stop();
                    setIsListening(false);
                    return;
                }

                recognitionRef.current = new SpeechRecognition();
                recognitionRef.current.lang = 'en-US';
                recognitionRef.current.onstart = () => setIsListening(true);
                recognitionRef.current.onresult = (event) => setTranscript(event.results[0][0].transcript);
                recognitionRef.current.onend = () => {
                    setIsListening(false);
                    // handleSend sẽ được gọi qua transcript nếu có giá trị
                };
                recognitionRef.current.start();
            };

            // Gửi transcript khi nhận dạng xong
            useEffect(() => {
                if (!isListening && transcript) {
                    handleSend(transcript);
                    setTranscript('');
                }
            }, [isListening, transcript]);

            return (
                <div className="flex flex-col h-screen max-w-2xl mx-auto bg-white shadow-xl relative">
                    {/* Header */}
                    <header className="p-4 bg-orange-500 text-white flex justify-between items-center shadow-md">
                        <div className="flex items-center gap-2">
                            <i data-lucide="mic" className="w-6 h-6"></i>
                            <h1 className="font-bold text-lg">English Voice Tutor</h1>
                        </div>
                        <button onClick={() => window.location.reload()} className="p-2 hover:bg-orange-600 rounded-full transition-colors">
                            <i data-lucide="rotate-ccw" className="w-5 h-5"></i>
                        </button>
                    </header>

                    {/* Chat Area */}
                    <main className="flex-1 overflow-y-auto p-4 space-y-4 chat-container">
                        {messages.map((msg) => (
                            <div key={msg.id} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[85%] p-4 rounded-2xl shadow-sm ${msg.role === 'user' ? 'bg-orange-500 text-white rounded-tr-sm' : 'bg-gray-100 text-gray-800 rounded-tl-sm'}`}>
                                    <p className="text-base font-medium">{msg.text}</p>
                                    {msg.translate && <p className="text-sm mt-2 opacity-70 border-t border-gray-300 pt-2">{msg.translate}</p>}
                                    {msg.advice && (
                                        <div className="mt-2 bg-yellow-100 p-2 rounded-lg text-xs text-yellow-800 flex items-start gap-1">
                                            <i data-lucide="lightbulb" className="w-3 h-3 mt-0.5"></i>
                                            <span>{msg.advice}</span>
                                        </div>
                                    )}
                                </div>
                            </div>
                        ))}
                        {isProcessing && <div className="text-gray-400 text-xs animate-pulse italic">AI đang trả lời...</div>}
                        {error && <div className="p-3 bg-red-100 text-red-600 rounded-xl text-xs">{error}</div>}
                        <div ref={messagesEndRef} />
                    </main>

                    {/* Interaction Area */}
                    <div className="p-4 bg-white border-t space-y-4">
                        {/* Suggestions */}
                        <div className="flex flex-wrap gap-2">
                            {suggestions.map((s, i) => (
                                <button key={i} onClick={() => handleSend(s)} disabled={isProcessing} className="text-xs py-2 px-3 bg-orange-50 text-orange-600 border border-orange-200 rounded-full hover:bg-orange-100 transition-colors">
                                    {s}
                                </button>
                            ))}
                        </div>

                        {/* Mic Control */}
                        <div className="flex justify-center items-center pb-4">
                            <button 
                                onClick={toggleMic}
                                className={`w-20 h-20 rounded-full flex items-center justify-center shadow-2xl transition-all ${isListening ? 'bg-red-500 scale-110' : 'bg-orange-500 shadow-orange-200'}`}
                            >
                                <i data-lucide={isListening ? "square" : "mic"} className="text-white w-8 h-8"></i>
                            </button>
                        </div>
                        {isListening && <p className="text-center text-red-500 text-xs animate-pulse font-medium">Đang lắng nghe: {transcript || "..."}</p>}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        // Khởi tạo Lucide Icons lần đầu
        setTimeout(() => { if (window.lucide) window.lucide.createIcons(); }, 100);
    </script>
</body>
</html>
