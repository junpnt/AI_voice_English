<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>AI Voice Tutor</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #ff6b35;
    --primary-dark: #e8541e;
    --primary-light: #fff0eb;
    --bg: #faf9f7;
    --surface: #ffffff;
    --border: #f0ede8;
    --text: #1a1512;
    --text-soft: #8a7d74;
    --ai-bubble: #f5f3f0;
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
    --shadow-primary: 0 8px 28px rgba(255,107,53,0.38);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Nunito', -apple-system, sans-serif;
    background: var(--bg);
    height: 100dvh;
    overflow: hidden;
    color: var(--text);
  }
  .shell {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    background: var(--surface);
    box-shadow: 0 0 60px rgba(0,0,0,0.08);
  }
  /* HEADER */
  .header {
    background: var(--primary);
    padding: 14px 18px;
    padding-top: max(14px, env(safe-area-inset-top));
    border-radius: 0 0 24px 24px;
    box-shadow: var(--shadow-primary);
    flex-shrink: 0;
  }
  .header-inner { display: flex; align-items: center; justify-content: space-between; }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .header-avatar { width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,0.22); display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .header-title { color: #fff; font-weight: 800; font-size: 16px; letter-spacing: -0.3px; line-height: 1; }
  .header-sub { color: rgba(255,255,255,0.72); font-size: 11px; margin-top: 2px; font-weight: 600; }
  .btn-reset { background: rgba(255,255,255,0.18); border: none; border-radius: 50%; width: 34px; height: 34px; cursor: pointer; color: #fff; display: flex; align-items: center; justify-content: center; }
  .btn-reset:active { background: rgba(255,255,255,0.32); }
  /* CHAT */
  .chat { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 14px; display: flex; flex-direction: column; gap: 14px; }
  .chat::-webkit-scrollbar { display: none; }
  .row { display: flex; }
  .row.ai { justify-content: flex-start; }
  .row.user { justify-content: flex-end; }
  .bubble { max-width: 82%; padding: 12px 15px; border-radius: 20px; box-shadow: var(--shadow-sm); line-height: 1.5; }
  .bubble.ai { background: var(--ai-bubble); border-radius: 4px 20px 20px 20px; color: var(--text); }
  .bubble.user { background: linear-gradient(135deg, #ff6b35, #e8541e); border-radius: 20px 4px 20px 20px; color: #fff; box-shadow: var(--shadow-primary); }
  .bubble-en { font-size: 15px; font-weight: 600; }
  .bubble-vi { font-size: 12px; color: var(--text-soft); margin-top: 5px; font-style: italic; padding-top: 5px; border-top: 1px solid rgba(0,0,0,0.07); }
  .bubble.user .bubble-vi { color: rgba(255,255,255,0.65); border-top-color: rgba(255,255,255,0.2); }
  .bubble-tip { margin-top: 8px; font-size: 11px; color: #2563eb; background: #eff6ff; padding: 6px 10px; border-radius: 10px; display: flex; gap: 5px; align-items: flex-start; line-height: 1.5; }
  .bubble-head { display: flex; align-items: flex-start; gap: 6px; }
  .btn-speak { background: none; border: none; cursor: pointer; color: var(--primary); padding: 2px; flex-shrink: 0; opacity: 0.7; }
  .btn-speak:active { opacity: 1; }
  /* Loading */
  .loading-row { display: flex; justify-content: flex-start; }
  .loading-bubble { background: var(--ai-bubble); border-radius: 4px 20px 20px 20px; padding: 14px 18px; display: flex; gap: 5px; align-items: center; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--primary); animation: dotBounce 1.2s ease-in-out infinite; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dotBounce { 0%,100% { transform: translateY(0); opacity: 0.4; } 50% { transform: translateY(-6px); opacity: 1; } }
  .error-box { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; border-radius: 14px; padding: 10px 14px; font-size: 12px; line-height: 1.6; }
  /* FOOTER */
  .footer { background: var(--surface); border-top: 1.5px solid var(--border); border-radius: 24px 24px 0 0; padding: 12px 16px; padding-bottom: max(20px, var(--safe-bottom)); box-shadow: 0 -4px 24px rgba(0,0,0,0.06); flex-shrink: 0; }
  .suggs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; }
  .suggs::-webkit-scrollbar { display: none; }
  .sugg-btn { white-space: nowrap; font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 700; padding: 7px 14px; background: var(--primary-light); color: var(--primary-dark); border: 1.5px solid #ffd5c2; border-radius: 20px; cursor: pointer; flex-shrink: 0; }
  .sugg-btn:active { background: #ffe0d4; }
  .sugg-btn:disabled { opacity: 0.45; cursor: default; }
  .input-row { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; }
  .text-input { flex: 1; padding: 11px 16px; border-radius: 24px; border: 1.5px solid #ffd5c2; background: var(--primary-light); font-family: 'Nunito', sans-serif; font-size: 16px; color: var(--text); outline: none; -webkit-appearance: none; }
  .text-input:focus { border-color: var(--primary); }
  .text-input::placeholder { color: #c4a99a; }
  .btn-send { width: 44px; height: 44px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--primary); box-shadow: var(--shadow-primary); color: #fff; }
  .btn-send:disabled { background: #e5e7eb; box-shadow: none; cursor: default; }
  .btn-send:active:not(:disabled) { transform: scale(0.92); }
  .mic-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .btn-mic { width: 68px; height: 68px; border-radius: 50%; border: none; cursor: pointer; color: #fff; display: flex; align-items: center; justify-content: center; position: relative; background: linear-gradient(135deg, #ff6b35, #e8541e); box-shadow: var(--shadow-primary); transition: all 0.2s; }
  .btn-mic.recording { background: linear-gradient(135deg, #ef4444, #dc2626); box-shadow: 0 8px 28px rgba(239,68,68,0.45); transform: scale(1.08); }
  .btn-mic.recording::before { content: ''; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid rgba(239,68,68,0.4); animation: micRing 1.2s ease-out infinite; }
  @keyframes micRing { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(1.5); opacity: 0; } }
  .mic-label { font-size: 11px; font-weight: 700; color: var(--text-soft); }
  .mic-label.active { color: #ef4444; }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <div class="header-inner">
      <div class="header-left">
        <div class="header-avatar">🎓</div>
        <div>
          <div class="header-title">AI TUTOR</div>
          <div class="header-sub">Luyện tiếng Anh cùng AI</div>
        </div>
      </div>
      <button class="btn-reset" onclick="resetApp()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
    </div>
  </div>

  <div class="chat" id="chat"></div>

  <div class="footer">
    <div class="suggs" id="suggs"></div>
    <div class="input-row">
      <input class="text-input" id="textInput" type="text" placeholder="Gõ tiếng Anh ở đây..." autocomplete="off" autocorrect="off" spellcheck="false">
      <button class="btn-send" id="sendBtn" disabled onclick="sendFromInput()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
    <div class="mic-wrap">
      <button class="btn-mic" id="micBtn" onclick="toggleMic()">
        <svg id="micIconSvg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="22"/>
        </svg>
      </button>
      <span class="mic-label" id="micLabel">Nhấn để nói</span>
    </div>
  </div>
</div>

<script>
// ── STATE ──
let isLoading = false;
let isRecording = false;
let speechUnlocked = false;
let recognition = null;
let currentSuggs = ["I'm fine, thank you!", "Not bad, and you?"];
let msgId = 0;

// ── DOM ──
const chatEl    = document.getElementById('chat');
const suggsEl   = document.getElementById('suggs');
const textInput = document.getElementById('textInput');
const sendBtn   = document.getElementById('sendBtn');
const micBtn    = document.getElementById('micBtn');
const micLabel  = document.getElementById('micLabel');

// ── INIT ──
function init() {
  addMessage('ai', {
    en: "Hello! I'm your AI English tutor 🎓 Let's practice together! How are you today?",
    vi: "Xin chào! Tôi là gia sư AI của bạn. Cùng luyện tập nhé! Hôm nay bạn thế nào?"
  });
  renderSuggs(currentSuggs);
  textInput.addEventListener('input', () => {
    sendBtn.disabled = !textInput.value.trim() || isLoading;
  });
  textInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendFromInput(); }
  });
  textInput.addEventListener('focus', unlockSpeech);
}

// ── iOS SPEECH FIX ──
function unlockSpeech() {
  if (speechUnlocked || !window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance('');
  u.volume = 0;
  window.speechSynthesis.speak(u);
  speechUnlocked = true;
}

function speakText(text) {
  if (!text || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  setTimeout(() => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.85;
    window.speechSynthesis.speak(u);
  }, 120);
}

// ── CLAUDE API (không cần API key) ──
async function callClaude(userMsg) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 400,
      system: `You are a friendly English tutor for Vietnamese learners. Keep replies short (1-3 sentences).
ALWAYS return ONLY a raw JSON object with no markdown, no code blocks:
{"en":"<English reply>","vi":"<Vietnamese translation>","tip":"<one short grammar tip in Vietnamese, max 15 words>","sug":["<suggestion 1>","<suggestion 2>"]}`,
      messages: [{ role: 'user', content: userMsg }]
    })
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err?.error?.message || `HTTP ${res.status}`);
  }

  const data = await res.json();
  let raw = data?.content?.[0]?.text || '';
  raw = raw.replace(/```json\s*/gi,'').replace(/```/g,'').trim();
  return JSON.parse(raw);
}

// ── SEND ──
async function sendMessage(text) {
  const val = (text || '').trim();
  if (!val || isLoading) return;
  unlockSpeech();

  textInput.value = '';
  sendBtn.disabled = true;
  setLoading(true);
  removeError();

  addMessage('user', { en: val });
  const loadId = addLoading();

  try {
    const res = await callClaude(val);
    removeLoading(loadId);
    addMessage('ai', { en: res.en, vi: res.vi, tip: res.tip });
    if (res.sug?.length) { currentSuggs = res.sug; renderSuggs(currentSuggs); }
    speakText(res.en);
  } catch (e) {
    removeLoading(loadId);
    showError('❌ ' + e.message);
  } finally {
    setLoading(false);
  }
}

function sendFromInput() { sendMessage(textInput.value); }

// ── MIC ──
function toggleMic() {
  unlockSpeech();
  if (isRecording) { stopMic(); return; }

  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Rec) {
    showError('⚠️ Trình duyệt không hỗ trợ mic. Dùng Safari iOS 14.5+ hoặc Chrome.');
    return;
  }

  recognition = new Rec();
  recognition.lang = 'en-US';
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = () => {
    isRecording = true;
    micBtn.classList.add('recording');
    micLabel.textContent = '🎙️ Đang nghe...';
    micLabel.classList.add('active');
  };
  recognition.onresult = e => { sendMessage(e.results[0][0].transcript); };
  recognition.onerror = e => {
    stopMic();
    const msgs = {
      'not-allowed': '⚠️ Chưa cấp quyền mic. Settings → Safari → Microphone → Allow.',
      'no-speech': '🔇 Không nghe thấy. Thử lại nhé!',
      'network': '🌐 Lỗi mạng khi nhận dạng giọng nói.',
      'audio-capture': '🎤 Không truy cập được microphone.',
    };
    if (e.error !== 'no-speech') showError(msgs[e.error] || `Lỗi: ${e.error}`);
  };
  recognition.onend = () => stopMic();

  try { recognition.start(); }
  catch(e) { showError('Không khởi động mic: ' + e.message); }
}

function stopMic() {
  isRecording = false;
  micBtn.classList.remove('recording');
  micLabel.textContent = 'Nhấn để nói';
  micLabel.classList.remove('active');
  try { recognition?.stop(); } catch(e) {}
}

// ── UI HELPERS ──
function addMessage(role, data) {
  const id = `msg-${++msgId}`;
  const div = document.createElement('div');
  div.className = `row ${role}`;
  div.id = id;

  const speakBtn = role === 'ai'
    ? `<button class="btn-speak" onclick="speakText(${JSON.stringify(data.en)})" title="Nghe lại">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
       </button>` : '';

  const viLine  = data.vi  ? `<div class="bubble-vi">${esc(data.vi)}</div>` : '';
  const tipLine = data.tip ? `<div class="bubble-tip"><span>💡</span><span>${esc(data.tip)}</span></div>` : '';

  div.innerHTML = `<div class="bubble ${role}">
    <div class="bubble-head"><span class="bubble-en">${esc(data.en)}</span>${speakBtn}</div>
    ${viLine}${tipLine}
  </div>`;

  chatEl.appendChild(div);
  scrollBottom();
  return id;
}

function addLoading() {
  const id = `load-${++msgId}`;
  const div = document.createElement('div');
  div.className = 'loading-row'; div.id = id;
  div.innerHTML = `<div class="loading-bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
  chatEl.appendChild(div);
  scrollBottom();
  return id;
}

function removeLoading(id) { document.getElementById(id)?.remove(); }

function showError(msg) {
  removeError();
  const div = document.createElement('div');
  div.className = 'error-box'; div.id = 'errBox'; div.textContent = msg;
  chatEl.appendChild(div);
  scrollBottom();
}
function removeError() { document.getElementById('errBox')?.remove(); }

function renderSuggs(list) {
  suggsEl.innerHTML = '';
  list.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'sugg-btn';
    btn.textContent = s;
    btn.disabled = isLoading;
    btn.onclick = () => sendMessage(s);
    suggsEl.appendChild(btn);
  });
}

function setLoading(val) {
  isLoading = val;
  document.querySelectorAll('.sugg-btn').forEach(b => b.disabled = val);
  if (!val) sendBtn.disabled = !textInput.value.trim();
}

function scrollBottom() {
  requestAnimationFrame(() => { chatEl.scrollTop = chatEl.scrollHeight; });
}

function esc(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function resetApp() {
  window.speechSynthesis?.cancel();
  stopMic();
  chatEl.innerHTML = '';
  msgId = 0; isLoading = false; speechUnlocked = false;
  currentSuggs = ["I'm fine, thank you!", "Not bad, and you?"];
  init();
}

init();
</script>
</body>
</html>
