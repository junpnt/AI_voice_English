<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI English Tutor | Voice Learning</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background: #f7f9fc;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        /* Main App Container */
        .app-container {
            width: 100%;
            max-width: 500px;
            height: 90vh;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Header */
        .header {
            background: #1a1a2e;
            color: white;
            padding: 20px 24px;
            border-bottom: 1px solid #2a2a40;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .header p {
            font-size: 0.8rem;
            opacity: 0.7;
            margin-top: 4px;
        }

        /* API Key Overlay */
        .api-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            transition: all 0.3s ease;
        }

        .api-card {
            background: white;
            border-radius: 28px;
            padding: 28px;
            width: 100%;
            max-width: 340px;
            box-shadow: 0 20px 35px -8px rgba(0, 0, 0, 0.2);
        }

        .api-card h3 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #1a1a2e;
        }

        .api-card p {
            font-size: 0.8rem;
            color: #5a5a6e;
            margin-bottom: 20px;
        }

        .api-card input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 16px;
            font-size: 0.9rem;
            margin-bottom: 16px;
            outline: none;
            transition: 0.2s;
        }

        .api-card input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59,130,246,0.2);
        }

        .api-card button {
            width: 100%;
            background: #1a1a2e;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .api-card button:active {
            transform: scale(0.97);
        }

        .error-msg {
            color: #dc2626;
            font-size: 0.75rem;
            margin-top: 12px;
            text-align: center;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        /* Message Bubbles */
        .message {
            display: flex;
            width: 100%;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.ai {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 24px;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .user .bubble {
            background: #1a1a2e;
            color: white;
            border-bottom-right-radius: 6px;
        }

        .ai .bubble {
            background: #f1f5f9;
            color: #1e293b;
            border-bottom-left-radius: 6px;
        }

        .timestamp {
            font-size: 0.7rem;
            margin-top: 5px;
            opacity: 0.6;
            text-align: right;
        }

        /* Typing Indicator */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 18px;
            background: #f1f5f9;
            border-radius: 24px;
            width: fit-content;
            border-bottom-left-radius: 6px;
        }

        .typing-indicator span {
            width: 6px;
            height: 6px;
            background: #94a3b8;
            border-radius: 50%;
            animation: pulse 1.2s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pulse {
            0%, 60%, 100% { transform: scale(0.8); opacity: 0.5; }
            30% { transform: scale(1.2); opacity: 1; }
        }

        /* Input Footer */
        .input-footer {
            padding: 16px 20px 24px;
            background: white;
            border-top: 1px solid #edf2f7;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .input-footer input {
            flex: 1;
            padding: 14px 18px;
            border: 1.5px solid #e2e8f0;
            border-radius: 40px;
            font-size: 0.95rem;
            outline: none;
            background: #f8fafc;
        }

        .input-footer input:focus {
            border-color: #3b82f6;
            background: white;
        }

        .mic-btn, .send-btn {
            background: #1a1a2e;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            color: white;
        }

        .mic-btn:active, .send-btn:active {
            transform: scale(0.94);
        }

        .mic-btn.recording {
            background: #dc2626;
            animation: pulse-red 1.5s infinite;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(220,38,38,0.4); }
            70% { box-shadow: 0 0 0 8px rgba(220,38,38,0); }
            100% { box-shadow: 0 0 0 0 rgba(220,38,38,0); }
        }

        button:disabled {
            opacity: 0.5;
            transform: none;
        }

        /* Scrollbar */
        .chat-area::-webkit-scrollbar {
            width: 4px;
        }
        .chat-area::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .chat-area::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="app-container" id="app">
    <div class="header">
        <h1>AI English Tutor</h1>
        <p>Your personal speaking coach • Voice enabled</p>
    </div>

    <!-- API Key Modal -->
    <div class="api-overlay" id="apiOverlay">
        <div class="api-card">
            <h3>✨ Welcome</h3>
            <p>Enter your Gemini API Key to start speaking English.</p>
            <input type="password" id="apiKeyInput" placeholder="AIzaSy..." autocomplete="off">
            <button id="saveKeyBtn">Start Session →</button>
            <div id="apiError" class="error-msg"></div>
            <div style="font-size: 0.7rem; text-align: center; margin-top: 16px; color:#666;">
                <a href="https://aistudio.google.com/apikey" target="_blank" style="color:#3b82f6;">Get your free API key here</a>
            </div>
        </div>
    </div>

    <!-- Chat Messages -->
    <div class="chat-area" id="chatArea">
        <div class="message ai">
            <div class="bubble">👋 Hello! I'm your AI English Tutor. Let's practice English together. How are you today?</div>
        </div>
    </div>

    <!-- Input Area -->
    <div class="input-footer">
        <input type="text" id="textInput" placeholder="Type your message..." autocomplete="off">
        <button class="mic-btn" id="micBtn" aria-label="Voice Input">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        </button>
        <button class="send-btn" id="sendBtn">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
    </div>
</div>

<script>
    // ---------- DOM Elements ----------
    const apiOverlay = document.getElementById('apiOverlay');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const saveKeyBtn = document.getElementById('saveKeyBtn');
    const apiError = document.getElementById('apiError');
    const chatArea = document.getElementById('chatArea');
    const textInput = document.getElementById('textInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');

    // ---------- App State ----------
    let API_KEY = '';
    let isProcessing = false;
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    // Speech Synthesis for AI voice
    let synth = window.speechSynthesis;
    let currentUtterance = null;

    // ---------- Helper Functions ----------
    function saveApiKey() {
        const key = apiKeyInput.value.trim();
        if (!key || !key.startsWith('AIza')) {
            apiError.textContent = '❌ Invalid API Key. Must start with "AIza".';
            return;
        }
        API_KEY = key;
        localStorage.setItem('gemini_api_key', key);
        apiOverlay.style.display = 'none';
        apiError.textContent = '';
        // Add welcome message from AI after setup
        addAIMessage("👋 Hello! I'm your AI English Tutor. Let's practice English together. How are you today?");
    }

    function loadStoredKey() {
        const stored = localStorage.getItem('gemini_api_key');
        if (stored && stored.startsWith('AIza')) {
            API_KEY = stored;
            apiOverlay.style.display = 'none';
            apiKeyInput.value = stored;
        } else {
            apiOverlay.style.display = 'flex';
        }
    }

    function addUserMessage(text) {
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message user';
        messageDiv.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
        chatArea.appendChild(messageDiv);
        scrollToBottom();
    }

    function addAIMessage(text) {
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message ai';
        messageDiv.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
        chatArea.appendChild(messageDiv);
        scrollToBottom();
        speakText(text);
    }

    function addTypingIndicator() {
        const typingDiv = document.createElement('div');
        typingDiv.className = 'message ai';
        typingDiv.id = 'typingIndicator';
        typingDiv.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;
        chatArea.appendChild(typingDiv);
        scrollToBottom();
    }

    function removeTypingIndicator() {
        const indicator = document.getElementById('typingIndicator');
        if (indicator) indicator.remove();
    }

    function scrollToBottom() {
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }

    // ---------- Text-to-Speech ----------
    function speakText(text) {
        if (!synth) return;
        if (currentUtterance) synth.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        utterance.pitch = 1.0;
        utterance.volume = 1;
        currentUtterance = utterance;
        synth.speak(utterance);
    }

    // ---------- Gemini API Call ----------
    async function callGemini(userMessage) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${API_KEY}`;

        // Enhanced prompt to ensure JSON output for structured responses
        const prompt = `You are a friendly, patient, and highly effective English tutor for Vietnamese learners. Your goal is to help the user improve their English speaking and writing skills through natural conversation.

**IMPORTANT RULES:**
1. Keep your response SHORT and CONVERSATIONAL (1-3 sentences maximum).
2. You MUST respond with a valid JSON object ONLY. No markdown, no code blocks, no extra text outside the JSON.
3. The JSON must have this exact structure:
{
  "reply": "Your English response to the user here. Keep it natural and helpful.",
  "correction": "If the user made a grammar mistake, provide the corrected version of their sentence. If no mistake, leave empty string.",
  "tip": "A very brief grammar or vocabulary tip (max 10 words) based on the conversation."
}

**Example:**
User: "I go to school yesterday."
Response: {"reply": "I see! Do you mean you went to school yesterday?", "correction": "I went to school yesterday.", "tip": "Use 'went' for past tense."}

User: "I'm fine, thank you."
Response: {"reply": "That's great to hear! What are you planning to do today?", "correction": "", "tip": "Great use of polite English!"}

User: "${userMessage}"
`;

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: {
                        temperature: 0.7,
                        maxOutputTokens: 200,
                        responseMimeType: "application/json"
                    }
                })
            });

            if (!response.ok) {
                const errorData = await response.json();
                console.error('API Error:', errorData);
                if (response.status === 403 || response.status === 401) {
                    throw new Error('Invalid API Key. Please check your key and try again.');
                }
                if (response.status === 429) {
                    throw new Error('Rate limit exceeded. Please wait a moment and try again.');
                }
                throw new Error(errorData.error?.message || 'API request failed');
            }

            const data = await response.json();
            const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
            
            // Try to parse JSON from response
            let jsonMatch = rawText.match(/\{[\s\S]*\}/);
            if (!jsonMatch) {
                throw new Error('Invalid response format from AI');
            }
            
            const parsed = JSON.parse(jsonMatch[0]);
            let finalReply = parsed.reply || "I'm here to help you practice English!";
            
            // Add correction if provided
            if (parsed.correction && parsed.correction.trim() !== "") {
                finalReply += `\n\n💡 Correction: ${parsed.correction}`;
            }
            
            // Add tip if provided
            if (parsed.tip && parsed.tip.trim() !== "") {
                finalReply += `\n\n📚 Tip: ${parsed.tip}`;
            }
            
            return finalReply;
        } catch (error) {
            console.error('Gemini API Error:', error);
            throw error;
        }
    }

    // ---------- Send Message Flow ----------
    async function sendMessage(message) {
        if (!message.trim() || isProcessing) return;
        if (!API_KEY) {
            apiOverlay.style.display = 'flex';
            return;
        }

        isProcessing = true;
        addUserMessage(message);
        textInput.value = '';
        addTypingIndicator();

        try {
            const aiReply = await callGemini(message);
            removeTypingIndicator();
            addAIMessage(aiReply);
        } catch (error) {
            removeTypingIndicator();
            let errorMsg = error.message;
            if (errorMsg.includes('API Key')) {
                errorMsg = '⚠️ API Key issue. Please re-enter your key.';
                apiOverlay.style.display = 'flex';
            } else if (errorMsg.includes('Rate limit')) {
                errorMsg = '⏳ Too many requests. Please wait a few seconds.';
            } else {
                errorMsg = '❌ Connection error. Please check your internet.';
            }
            addAIMessage(errorMsg);
            console.error('Send message error:', error);
        } finally {
            isProcessing = false;
        }
    }

    // ---------- Voice Recording using MediaRecorder (More stable) ----------
    async function startRecording() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];

            mediaRecorder.ondataavailable = (event) => {
                audioChunks.push(event.data);
            };

            mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                // Stop all tracks
                stream.getTracks().forEach(track => track.stop());
                
                // Convert to base64 for Whisper-like transcription (using Web Speech API as fallback)
                // For simplicity and compatibility, we'll use the Web Speech API for transcription
                // This avoids needing an extra API key for Whisper
                transcribeAudio(audioBlob);
            };

            mediaRecorder.start();
            isRecording = true;
            micBtn.classList.add('recording');
            micBtn.style.background = '#dc2626';
        } catch (err) {
            console.error('Microphone error:', err);
            alert('Cannot access microphone. Please check permissions.');
        }
    }

    function stopRecording() {
        if (mediaRecorder && isRecording) {
            mediaRecorder.stop();
            isRecording = false;
            micBtn.classList.remove('recording');
            micBtn.style.background = '#1a1a2e';
        }
    }

    function transcribeAudio(audioBlob) {
        // Use Web Speech API for transcription (works well on mobile)
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.start();
        
        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            if (transcript && transcript.trim()) {
                sendMessage(transcript);
            } else {
                addAIMessage("I couldn't hear you clearly. Could you please type or try speaking again?");
            }
        };

        recognition.onerror = (event) => {
            console.error('Speech recognition error:', event.error);
            addAIMessage("Sorry, I had trouble hearing you. Please type your message or check your microphone.");
        };
    }

    function toggleRecording() {
        if (isRecording) {
            stopRecording();
        } else {
            startRecording();
        }
    }

    // ---------- Event Listeners ----------
    saveKeyBtn.addEventListener('click', saveApiKey);
    sendBtn.addEventListener('click', () => sendMessage(textInput.value));
    micBtn.addEventListener('click', toggleRecording);
    
    textInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage(textInput.value);
        }
    });

    // Initialize on page load
    loadStoredKey();

    // Optional: Pre-load speech synthesis to avoid delay on first speak
    if (synth) {
        // Dummy utterance to warm up the engine on some browsers
        const dummy = new SpeechSynthesisUtterance('');
        synth.speak(dummy);
    }
</script>
</body>
</html>
