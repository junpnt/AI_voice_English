<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>AI English Tutor Pro | Học nói tiếng Anh</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --or:#e8541e; --or2:#ff6b35; --or-lt:#fff0eb; --or-bd:#ffd5c2; --or-dk:#bf3d0e;
  --bg:#faf9f7; --sur:#ffffff; --bd:#f0ede8;
  --tx:#1a1512; --tx2:#8a7d74;
  --ai:#f5f3f0;
  --sp-bot:env(safe-area-inset-bottom,0px);
  --sp-top:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Nunito',-apple-system,sans-serif;background:var(--bg);height:100dvh;overflow:hidden;color:var(--tx);}
/* ── SETUP SCREEN ── */
#setup{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;gap:20px;}
.setup-logo{width:72px;height:72px;border-radius:24px;background:var(--or);display:flex;align-items:center;justify-content:center;}
.setup-logo svg{stroke:#fff;}
.setup-title{font-size:22px;font-weight:800;color:var(--tx);text-align:center;letter-spacing:-0.5px;}
.setup-sub{font-size:14px;color:var(--tx2);text-align:center;line-height:1.6;max-width:320px;}
.setup-card{width:100%;max-width:360px;background:var(--sur);border:1px solid var(--bd);border-radius:20px;padding:20px;}
.setup-label{font-size:12px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;}
.setup-input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--or-bd);background:var(--or-lt);font-family:'Nunito',sans-serif;font-size:15px;color:var(--tx);outline:none;letter-spacing:1px;}
.setup-input:focus{border-color:var(--or);}
.setup-hint{font-size:11px;color:var(--tx2);margin-top:8px;line-height:1.5;}
.setup-hint a{color:var(--or);text-decoration:none;font-weight:700;}
.btn-start{width:100%;max-width:360px;padding:14px;border-radius:14px;border:none;background:var(--or);color:#fff;font-family:'Nunito',sans-serif;font-size:16px;font-weight:800;cursor:pointer;letter-spacing:-0.3px;box-shadow:0 8px 24px rgba(232,84,30,0.35);}
.btn-start:active{transform:scale(0.98);}
.setup-err{color:#dc2626;font-size:12px;text-align:center;background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:8px 14px;width:100%;max-width:360px;}
/* ── MAIN APP ── */
#app{display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto;background:var(--sur);box-shadow:0 0 60px rgba(0,0,0,0.08);}
.hd{background:var(--or);padding:14px 18px;padding-top:max(14px,var(--sp-top));border-radius:0 0 22px 22px;box-shadow:0 6px 24px rgba(232,84,30,0.35);flex-shrink:0;}
.hd-in{display:flex;align-items:center;justify-content:space-between;}
.hd-l{display:flex;align-items:center;gap:10px;}
.hd-av{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.22);display:flex;align-items:center;justify-content:center;}
.hd-av svg{stroke:#fff;}
.hd-t{color:#fff;font-weight:800;font-size:15px;line-height:1;}
.hd-s{color:rgba(255,255,255,0.72);font-size:11px;margin-top:2px;}
.hd-btns{display:flex;gap:8px;}
.hd-btn{background:rgba(255,255,255,0.18);border:none;border-radius:50%;width:32px;height:32px;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;}
.hd-btn:active{background:rgba(255,255,255,0.32);}
/* ── CHAT ── */
.chat{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 12px;display:flex;flex-direction:column;gap:12px;}
.chat::-webkit-scrollbar{width:3px;}
.chat::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px;}
.row{display:flex;}
.row.ai{justify-content:flex-start;}.row.user{justify-content:flex-end;}
.bub{max-width:83%;padding:11px 14px;border-radius:18px;font-size:14px;line-height:1.55;}
.bub.ai{background:var(--ai);border-radius:4px 18px 18px 18px;color:var(--tx);}
.bub.user{background:linear-gradient(135deg,var(--or2),var(--or));border-radius:18px 4px 18px 18px;color:#fff;box-shadow:0 4px 14px rgba(232,84,30,0.3);}
.bub-en{font-weight:600;}
.bub-vi{font-size:12px;color:var(--tx2);margin-top:5px;padding-top:5px;border-top:1px solid rgba(0,0,0,0.07);font-style:italic;}
.bub.user .bub-vi{color:rgba(255,255,255,0.65);border-top-color:rgba(255,255,255,0.2);}
.bub-tip{margin-top:7px;font-size:11px;color:#2563eb;background:#eff6ff;padding:5px 9px;border-radius:9px;line-height:1.5;}
.bub-hd{display:flex;align-items:flex-start;gap:5px;}
.btn-spk{background:none;border:none;cursor:pointer;color:var(--or);padding:1px;flex-shrink:0;opacity:0.7;}
.btn-spk:active{opacity:1;}
.suggestion-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.suggestion-chip{background:#fff0eb;border:1px solid var(--or-bd);border-radius:20px;padding:5px 12px;font-size:11px;font-weight:600;color:var(--or-dk);cursor:pointer;transition:0.2s;}
.suggestion-chip:active{background:var(--or-bd);}
/* Loading */
.ld-row{display:flex;}.ld-bub{background:var(--ai);border-radius:4px 18px 18px 18px;padding:14px 18px;display:flex;gap:5px;align-items:center;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--or);animation:db 1.2s ease-in-out infinite;}
.dot:nth-child(2){animation-delay:.2s;}.dot:nth-child(3){animation-delay:.4s;}
@keyframes db{0%,100%{transform:translateY(0);opacity:.35;}50%{transform:translateY(-5px);opacity:1;}}
.err-box{background:#fef2f2;color:#dc2626;border:1px solid #fecaca;border-radius:12px;padding:9px 13px;font-size:12px;line-height:1.5;}
/* ── FOOTER ── */
.ft{background:var(--sur);border-top:1.5px solid var(--bd);border-radius:22px 22px 0 0;padding:11px 14px;padding-bottom:max(18px,var(--sp-bot));box-shadow:0 -4px 20px rgba(0,0,0,0.05);flex-shrink:0;}
.suggs{display:flex;gap:7px;overflow-x:auto;padding-bottom:9px;margin-bottom:8px;}
.suggs::-webkit-scrollbar{display:none;}
.sg{white-space:nowrap;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;padding:6px 13px;background:var(--or-lt);color:var(--or-dk);border:1.5px solid var(--or-bd);border-radius:20px;cursor:pointer;flex-shrink:0;}
.sg:active{background:var(--or-bd);}.sg:disabled{opacity:.4;cursor:default;}
.inp-row{display:flex;gap:8px;align-items:center;margin-bottom:12px;}
.txt-in{flex:1;padding:11px 15px;border-radius:22px;border:1.5px solid var(--or-bd);background:var(--or-lt);font-family:'Nunito',sans-serif;font-size:16px;color:var(--tx);outline:none;-webkit-appearance:none;}
.txt-in:focus{border-color:var(--or);}
.txt-in::placeholder{color:#c4a99a;}
.btn-snd{width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--or);color:#fff;box-shadow:0 4px 14px rgba(232,84,30,0.35);}
.btn-snd:disabled{background:#e5e7eb;box-shadow:none;cursor:default;}
.btn-snd:active:not(:disabled){transform:scale(0.92);}
.mic-wrap{display:flex;flex-direction:column;align-items:center;gap:5px;margin-top:5px;}
.btn-mic{width:64px;height:64px;border-radius:50%;border:none;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--or2),var(--or));box-shadow:0 8px 24px rgba(232,84,30,0.38);position:relative;transition:all .2s;}
.btn-mic.rec{background:linear-gradient(135deg,#f87171,#ef4444);box-shadow:0 8px 24px rgba(239,68,68,0.42);transform:scale(1.07);}
.btn-mic.rec::before{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(239,68,68,0.35);animation:mr 1.1s ease-out infinite;}
@keyframes mr{0%{transform:scale(1);opacity:.8;}100%{transform:scale(1.5);opacity:0;}}
.mic-lbl{font-size:11px;font-weight:700;color:var(--tx2);}
.mic-lbl.act{color:#ef4444;}
.suggestion-btn{background:rgba(255,255,255,0.2);border:none;border-radius:20px;padding:6px 12px;font-size:11px;font-weight:600;color:#fff;display:flex;align-items:center;gap:4px;cursor:pointer;}
.suggestion-btn:active{background:rgba(255,255,255,0.3);}
</style>
</head>
<body>

<div id="setup">
  <div class="setup-logo">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/>
    </svg>
  </div>
  <div class="setup-title">AI English Tutor Pro</div>
  <div class="setup-sub">Nhập Gemini API Key (hỗ trợ Gemma, Gemini 2.0). Key được lưu trên máy bạn.</div>
  <div class="setup-card">
    <div class="setup-label">API Key</div>
    <input class="setup-input" id="keyInput" type="password" placeholder="AIzaSy..." autocomplete="off">
    <div class="setup-hint">
      Lấy key miễn phí tại <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com</a><br>
      <span style="font-size:10px;">✅ Khuyên dùng model: gemma-3-27b-it (hạn mức cao)</span>
    </div>
  </div>
  <div id="setupErr" class="setup-err" style="display:none;"></div>
  <button class="btn-start" onclick="startApp()">Bắt đầu luyện tập →</button>
</div>

<div id="app" style="display:none;">
  <div class="hd">
    <div class="hd-in">
      <div class="hd-l">
        <div class="hd-av">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        </div>
        <div>
          <div class="hd-t">AI English Tutor Pro</div>
          <div class="hd-s">💡 Tự động gợi ý câu hỏi</div>
        </div>
      </div>
      <div class="hd-btns">
        <button class="hd-btn" onclick="resetChat()" title="Cuộc trò chuyện mới">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <button class="hd-btn" onclick="clearHistory()" title="Xóa lịch sử">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 13a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-13"/><path d="M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/></svg>
        </button>
        <button class="hd-btn" onclick="logout()" title="Đổi API Key">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="chat" id="chat"></div>

  <div class="ft">
    <div class="suggs" id="suggs"></div>
    <div class="inp-row">
      <input class="txt-in" id="txtin" type="text" placeholder="Nhập tiếng Anh hoặc chọn gợi ý..." autocomplete="off">
      <button class="btn-snd" id="sndbtn" disabled onclick="sendFromInput()">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
    <div class="mic-wrap">
      <div style="display:flex; gap:12px; align-items:center; justify-content:center; width:100%;">
        <button class="suggestion-btn" id="suggestBtn" onclick="requestSuggestions()">💡 Gợi ý câu hỏi</button>
        <button class="btn-mic" id="micbtn" onclick="toggleMic()">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        </button>
      </div>
      <span class="mic-lbl" id="miclbl">Nhấn để nói</span>
    </div>
  </div>
</div>

<script>
// ==================== CONFIG ====================
// Dùng model Gemma-3-27b-it (hạn mức cao, 3000 requests/ngày) hoặc gemini-2.0-flash
const GEMINI_MODEL = 'gemma-3-27b-it';  // hoặc 'gemini-2.0-flash'
const GEMINI_BASE = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`;
const KEY_STORE = 'tutor_gemini_key';
const HISTORY_STORE = 'tutor_chat_history';

let API_KEY = '';
let busy = false;
let recording = false;
let recognition = null;
let mid = 0;
let currentSuggestions = []; // lưu gợi ý từ AI trả về

// DOM
const chatEl = document.getElementById('chat');
const suggsEl = document.getElementById('suggs');
const inp = document.getElementById('txtin');
const sndBtn = document.getElementById('sndbtn');
const micBtn = document.getElementById('micbtn');
const micLbl = document.getElementById('miclbl');

// ==================== SETUP ====================
function startApp() {
  const key = document.getElementById('keyInput').value.trim();
  if (!key.startsWith('AIza') || key.length < 30) {
    showSetupErr('Key không hợp lệ (phải bắt đầu bằng AIza... và dài >30 ký tự)');
    return;
  }
  API_KEY = key;
  localStorage.setItem(KEY_STORE, key);
  document.getElementById('setup').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  loadHistory();
  if (chatEl.children.length === 0) {
    addMsg('ai', {
      en: "Hello! I'm your AI English tutor. Let's practice! How are you today?",
      vi: "Xin chào! Tôi là gia sư AI của bạn. Hôm nay bạn thế nào?",
      tip: "Hãy thử trả lời bằng tiếng Anh, tôi sẽ sửa lỗi và gợi ý câu hỏi tiếp theo."
    });
  }
  initEventListeners();
  renderSuggs([]);
}

function showSetupErr(msg) {
  const el = document.getElementById('setupErr');
  el.textContent = msg; el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 5000);
}

function logout() {
  window.speechSynthesis?.cancel();
  stopMic();
  localStorage.removeItem(KEY_STORE);
  API_KEY = '';
  document.getElementById('app').style.display = 'none';
  document.getElementById('setup').style.display = 'flex';
  document.getElementById('keyInput').value = '';
}

function initEventListeners() {
  inp.addEventListener('input', () => { sndBtn.disabled = !inp.value.trim() || busy; });
  inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendFromInput(); } });
  inp.addEventListener('focus', unlockSpeech);
}

// ==================== LƯU LỊCH SỬ ====================
function saveHistory() {
  const messages = [];
  for (let i = 0; i < chatEl.children.length; i++) {
    const row = chatEl.children[i];
    if (row.classList.contains('row')) {
      const role = row.classList.contains('user') ? 'user' : 'ai';
      const bubble = row.querySelector('.bub');
      if (bubble) {
        const enSpan = bubble.querySelector('.bub-en');
        const viDiv = bubble.querySelector('.bub-vi');
        const tipDiv = bubble.querySelector('.bub-tip');
        messages.push({
          role,
          en: enSpan ? enSpan.innerText : '',
          vi: viDiv ? viDiv.innerText.replace('💡 ', '') : '',
          tip: tipDiv ? tipDiv.innerText.replace('💡 ', '') : ''
        });
      }
    }
  }
  localStorage.setItem(HISTORY_STORE, JSON.stringify(messages));
}

function loadHistory() {
  const saved = localStorage.getItem(HISTORY_STORE);
  if (!saved) return;
  try {
    const messages = JSON.parse(saved);
    for (const msg of messages) {
      addMsg(msg.role, { en: msg.en, vi: msg.vi, tip: msg.tip }, false);
    }
    scroll();
  } catch(e) {}
}

function clearHistory() {
  if (confirm('Xóa toàn bộ lịch sử trò chuyện?')) {
    localStorage.removeItem(HISTORY_STORE);
    resetChat();
  }
}

// ==================== CHAT UI ====================
function addMsg(role, data, save = true) {
  const id = 'm'+(++mid);
  const div = document.createElement('div');
  div.className = `row ${role}`;
  div.id = id;
  const spk = role === 'ai' ? `<button class="btn-spk" onclick="speakTxt(${JSON.stringify(data.en)})" title="Nghe lại">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
    </button>` : '';
  const vi = data.vi ? `<div class="bub-vi">${esc(data.vi)}</div>` : '';
  const tip = data.tip ? `<div class="bub-tip">💡 ${esc(data.tip)}</div>` : '';
  div.innerHTML = `<div class="bub ${role}"><div class="bub-hd"><span class="bub-en">${esc(data.en)}</span>${spk}</div>${vi}${tip}</div>`;
  chatEl.appendChild(div);
  if (save) saveHistory();
  scroll();
  return id;
}

function addLoading() {
  const id = 'l'+(++mid);
  const div = document.createElement('div');
  div.className = 'ld-row';
  div.id = id;
  div.innerHTML = `<div class="ld-bub"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
  chatEl.appendChild(div);
  scroll();
  return id;
}

function removeEl(id) { document.getElementById(id)?.remove(); }

function showErr(msg) {
  const d = document.createElement('div');
  d.className = 'err-box';
  d.textContent = '⚠️ ' + msg;
  chatEl.appendChild(d);
  scroll();
  setTimeout(() => d.remove(), 5000);
}

function scroll() { requestAnimationFrame(() => { chatEl.scrollTop = chatEl.scrollHeight; }); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ==================== GỢI Ý CÂU ====================
function renderSuggs(suggestions) {
  suggsEl.innerHTML = '';
  if (!suggestions || suggestions.length === 0) {
    // Hiển thị vài gợi ý mặc định nếu chưa có
    suggestions = ["What do you like to do in your free time?", "Tell me about your family.", "What's your favorite food?"];
  }
  currentSuggestions = suggestions.slice(0, 5);
  currentSuggestions.forEach(s => {
    const chip = document.createElement('button');
    chip.className = 'sg';
    chip.textContent = s;
    chip.disabled = busy;
    chip.onclick = () => sendMsg(s);
    suggsEl.appendChild(chip);
  });
}

// Yêu cầu AI gợi ý chủ đề/câu hỏi riêng
async function requestSuggestions() {
  if (busy) { showErr('Đang xử lý, hãy đợi.'); return; }
  unlockSpeech();
  const lid = addLoading();
  try {
    const prompt = `You are an English tutor. The user needs conversation ideas. Suggest 3 simple English questions (each short, for beginners) that they can ask you. Return ONLY a JSON array: ["question 1", "question 2", "question 3"]`;
    const res = await fetch(`${GEMINI_BASE}?key=${API_KEY}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: { temperature: 0.8, maxOutputTokens: 100 }
      })
    });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    let raw = data.candidates[0].content.parts[0].text;
    raw = raw.replace(/```json|```/g, '').trim();
    const suggestions = JSON.parse(raw);
    if (Array.isArray(suggestions)) {
      renderSuggs(suggestions);
      showErr('✨ Đã cập nhật gợi ý câu hỏi mới!');
    } else throw new Error();
  } catch(e) {
    showErr('Không lấy được gợi ý, hãy thử lại.');
  } finally {
    removeEl(lid);
  }
}

// ==================== GEMINI CALL ====================
async function callGemini(userMsg) {
  const prompt = `You are a friendly English tutor for Vietnamese learners. Keep replies short (1-2 sentences). Always respond in JSON:
{
  "en": "your English reply",
  "vi": "Vietnamese translation",
  "tip": "short grammar tip (max 10 words)",
  "suggestions": ["question 1", "question 2"]  // two simple follow-up questions for the user
}
Student message: ${userMsg}`;

  const res = await fetch(`${GEMINI_BASE}?key=${API_KEY}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: [{ parts: [{ text: prompt }] }],
      generationConfig: { temperature: 0.7, maxOutputTokens: 300 }
    })
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    if (res.status === 429) throw new Error('Hết quota dùng thử. Hãy thử model gemma-3-27b-it hoặc đợi ngày mai.');
    if (res.status === 403) throw new Error('API key không hợp lệ hoặc chưa bật API.');
    throw new Error(err.error?.message || 'Lỗi kết nối AI');
  }
  const data = await res.json();
  let raw = data.candidates[0].content.parts[0].text;
  raw = raw.replace(/```json|```/g, '').trim();
  const match = raw.match(/\{[\s\S]*\}/);
  if (!match) throw new Error('AI phản hồi sai định dạng');
  return JSON.parse(match[0]);
}

// ==================== SEND MESSAGE ====================
async function sendMsg(txt) {
  const v = txt.trim();
  if (!v || busy) return;
  unlockSpeech();
  inp.value = '';
  sndBtn.disabled = true;
  busy = true;
  removeErr();
  addMsg('user', { en: v });
  const lid = addLoading();
  try {
    const res = await callGemini(v);
    removeEl(lid);
    addMsg('ai', { en: res.en, vi: res.vi, tip: res.tip });
    if (res.suggestions && Array.isArray(res.suggestions)) {
      renderSuggs(res.suggestions);
    } else {
      // fallback: giữ lại gợi ý cũ
    }
    speakTxt(res.en);
  } catch(e) {
    removeEl(lid);
    showErr(e.message);
  } finally {
    busy = false;
    sndBtn.disabled = !inp.value.trim();
  }
}

function sendFromInput() { sendMsg(inp.value); }

// ==================== SPEECH & MIC ====================
let spkUnlock = false;
function unlockSpeech() {
  if (spkUnlock || !window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance('');
  u.volume = 0;
  window.speechSynthesis.speak(u);
  spkUnlock = true;
}

function speakTxt(t) {
  if (!t || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  setTimeout(() => {
    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'en-US';
    u.rate = 0.85;
    window.speechSynthesis.speak(u);
  }, 100);
}

function toggleMic() {
  unlockSpeech();
  if (recording) { stopMic(); return; }
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) { showErr('Trình duyệt không hỗ trợ nhận dạng giọng nói.'); return; }
  recognition = new SpeechRecognition();
  recognition.lang = 'en-US';
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.onstart = () => {
    recording = true;
    micBtn.classList.add('rec');
    micLbl.textContent = 'Đang nghe...';
    micLbl.classList.add('act');
  };
  recognition.onresult = (e) => {
    const transcript = e.results[0][0].transcript;
    if (transcript.trim()) sendMsg(transcript);
    else showErr('Không nhận diện được giọng nói.');
    stopMic();
  };
  recognition.onerror = (e) => {
    let msg = '';
    if (e.error === 'not-allowed') msg = 'Chưa cấp quyền mic. Vào Settings → Safari → Microphone → Allow.';
    else if (e.error === 'no-speech') msg = 'Không nghe thấy giọng nói.';
    else msg = `Lỗi mic: ${e.error}`;
    showErr(msg);
    stopMic();
  };
  recognition.onend = () => stopMic();
  try { recognition.start(); } catch(e) { showErr('Không thể khởi động mic.'); stopMic(); }
}

function stopMic() {
  if (recognition) { try { recognition.abort(); } catch(e) {} recognition = null; }
  recording = false;
  micBtn.classList.remove('rec');
  micLbl.textContent = 'Nhấn để nói';
  micLbl.classList.remove('act');
}

function resetChat() {
  window.speechSynthesis?.cancel();
  stopMic();
  chatEl.innerHTML = '';
  mid = 0;
  currentSuggestions = [];
  addMsg('ai', {
    en: "Hello! I'm your AI English tutor. Let's practice! How are you today?",
    vi: "Xin chào! Tôi là gia sư AI của bạn. Hôm nay bạn thế nào?",
    tip: "Hãy thử trả lời bằng tiếng Anh, tôi sẽ sửa lỗi và gợi ý câu hỏi tiếp theo."
  });
  renderSuggs([]);
  saveHistory();
}

    }

  }
