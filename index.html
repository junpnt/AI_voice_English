<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Voice Tutor - Pro Max</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #fdfcfb; touch-action: manipulation; }
        .chat-area { height: calc(100vh - 280px); overflow-y: auto; scroll-behavior: smooth; }
        .rounded-msg { border-radius: 1.5rem; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="text-gray-900">
    <div id="root"></div>

    <script type="text/babel">
        // ĐÃ DÁN KEY CHÍNH XÁC CỦA BẠN
        const API_KEY = "AIzaSyBMox0NFLIN1xZtPJbcqoT2YeCeFAoMh30"; 

        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [messages, setMessages] = useState([
                { id: 1, role: 'ai', en: "Hello! Ready to practice English? How are you?", vi: "Chào bạn! Sẵn sàng luyện tiếng Anh chưa? Bạn thấy thế nào?" }
            ]);
            const [isMic, setIsMic] = useState(false);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [suggs, setSuggs] = useState(["I am fine, thanks!", "I feel great!"]);
            const endRef = useRef(null);

            useEffect(() => { 
                endRef.current?.scrollIntoView(); 
                if(window.lucide) window.lucide.createIcons();
            }, [messages]);

            const speak = (txt) => {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(txt);
                u.lang = 'en-US'; u.rate = 0.8;
                window.speechSynthesis.speak(u);
            };

            const callAI = async (input) => {
                // CHỐN LỖI: Sử dụng định dạng URL và Payload tương thích nhất cho v1
                const url = `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `
                            You are an English tutor. Task: Reply to student.
                            Message: "${input}"
                            Strict format: RETURN ONLY JSON. NO CODE BLOCKS.
                            Format: {"en": "reply", "vi": "dịch", "tip": "advice", "sug": ["option1", "option2"]}
                        ` }] }]
                    })
                });

                if (!response.ok) {
                    const errRes = await response.json();
                    throw new Error(errRes.error?.message || "Lỗi mạng hoặc Key bị khóa");
                }

                const data = await response.json();
                let raw = data.candidates[0].content.parts[0].text;
                // Dọn dẹp ký tự thừa do AI đôi khi trả về Markdown
                raw = raw.replace(/```json/g, "").replace(/```/g, "").trim();
                return JSON.parse(raw);
            };

            const send = async (val) => {
                if (!val.trim() || loading) return;
                setMessages(p => [...p, { id: Date.now(), role: 'user', en: val }]);
                setLoading(true); setError(null);

                try {
                    const res = await callAI(val);
                    setMessages(p => [...p, { id: Date.now()+1, role: 'ai', en: res.en, vi: res.vi, tip: res.tip }]);
                    if (res.sug) setSuggs(res.sug);
                    speak(res.en);
                } catch (e) {
                    setError("Lỗi kết nối: " + e.message);
                } finally { setLoading(false); }
            };

            const startMic = () => {
                const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!Rec) return alert("Vui lòng mở bằng Safari trên iPhone!");
                const rec = new Rec();
                rec.lang = 'en-US';
                rec.onstart = () => setIsMic(true);
                rec.onresult = (e) => {
                    const t = e.results[0][0].transcript;
                    if (e.results[0].isFinal) send(t);
                };
                rec.onend = () => setIsMic(false);
                rec.start();
            };

            return (
                <div className="flex flex-col h-screen max-w-lg mx-auto bg-white border-x border-gray-100">
                    <header className="p-4 bg-orange-500 text-white flex justify-between items-center shadow-lg rounded-b-2xl">
                        <div className="flex items-center gap-2">
                            <i data-lucide="mic-2" className="w-6 h-6"></i>
                            <span className="font-bold letter tracking-tight">AI TUTOR PRO</span>
                        </div>
                        <button onClick={() => window.location.reload()}><i data-lucide="rotate-ccw" className="w-5 h-5"></i></button>
                    </header>

                    <main className="flex-1 p-4 space-y-4 chat-area no-scrollbar">
                        {messages.map(m => (
                            <div key={m.id} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`p-4 rounded-msg max-w-[85%] shadow-sm ${m.role === 'user' ? 'bg-orange-500 text-white rounded-tr-none' : 'bg-gray-100 text-gray-800 rounded-tl-none border border-gray-200'}`}>
                                    <p className="font-medium text-[15px]">{m.en}</p>
                                    {m.vi && <p className="text-[11px] opacity-60 mt-1 border-t pt-1 italic">{m.vi}</p>}
                                    {m.tip && <div className="mt-2 text-[10px] text-blue-600 bg-blue-50 p-1.5 rounded-lg flex items-start gap-1">
                                        <i data-lucide="info" className="w-3 h-3 mt-0.5"></i> <span>{m.tip}</span>
                                    </div>}
                                </div>
                            </div>
                        ))}
                        {loading && <div className="text-[10px] text-gray-400 animate-pulse px-2">AI đang phản hồi...</div>}
                        {error && <div className="p-3 bg-red-100 text-red-600 rounded-2xl text-[10px] m-2 border border-red-200">{error}</div>}
                        <div ref={endRef} />
                    </main>

                    <footer className="p-4 bg-white border-t border-gray-100 space-y-4 rounded-t-3xl shadow-top">
                        <div className="flex gap-2 overflow-x-auto no-scrollbar py-2">
                            {suggs.map((s, i) => (
                                <button key={i} onClick={() => send(s)} disabled={loading} className="whitespace-nowrap text-[12px] py-2 px-4 bg-orange-50 text-orange-600 border border-orange-100 rounded-full active:bg-orange-200 transition-colors uppercase font-semibold">
                                    {s}
                                </button>
                            ))}
                        </div>
                        <div className="flex justify-center items-center pb-6">
                            <button onClick={startMic} className={`w-20 h-20 rounded-full flex items-center justify-center shadow-2xl transition-all ${isMic ? 'bg-red-500 scale-110' : 'bg-orange-500'}`}>
                                <i data-lucide={isMic ? "square" : "mic"} className="text-white w-8 h-8"></i>
                            </button>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
