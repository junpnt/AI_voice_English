<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>AI English Tutor Pro - Học tiếng Anh với AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --primary: #e8541e;
  --primary-dark: #bf3d0e;
  --primary-light: #fff0eb;
  --primary-border: #ffd5c2;
  --bg: #faf9f7;
  --surface: #ffffff;
  --border: #f0ede8;
  --text: #1a1512;
  --text-light: #8a7d74;
  --ai-bg: #f5f3f0;
  --success: #10b981;
  --error: #ef4444;
  --warning: #f59e0b;
}

body.dark {
  --bg: #121212;
  --surface: #1e1e1e;
  --border: #2c2c2c;
  --text: #ededed;
  --text-light: #a0a0a0;
  --ai-bg: #2a2a2a;
  --primary-light: #2c1a12;
  --primary-border: #5c2a14;
}

body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg);
  height: 100dvh;
  overflow: hidden;
  color: var(--text);
  transition: background 0.2s, color 0.2s;
}

/* Setup screen */
#setup {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 100;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 24px;
  gap: 20px;
}
.setup-logo { width: 72px; height: 72px; border-radius: 24px; background: var(--primary); display: flex; align-items: center; justify-content: center; color: white; font-size: 32px; }
.setup-title { font-size: 24px; font-weight: 800; text-align: center; }
.setup-sub { font-size: 14px; color: var(--text-light); text-align: center; max-width: 320px; }
.setup-card { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 20px; }
.setup-label { font-size: 12px; font-weight: 700; margin-bottom: 8px; text-transform: uppercase; }
.setup-input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--primary-border); background: var(--primary-light); font-family: inherit; font-size: 15px; color: var(--text); outline: none; }
.setup-input:focus { border-color: var(--primary); }
.setup-hint { font-size: 11px; margin-top: 8px; color: var(--text-light); }
.setup-hint a { color: var(--primary); text-decoration: none; }
.btn-start { width: 100%; max-width: 360px; padding: 14px; border-radius: 14px; border: none; background: var(--primary); color: white; font-weight: 800; font-size: 16px; cursor: pointer; box-shadow: 0 8px 24px rgba(232,84,30,0.35); }
.btn-start:active { transform: scale(0.98); }
.setup-err { background: #fef2f2; color: var(--error); padding: 8px 14px; border-radius: 10px; font-size: 12px; max-width: 360px; display: none; }

/* Main app */
#app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 550px;
  margin: 0 auto;
  background: var(--surface);
  box-shadow: 0 0 60px rgba(0,0,0,0.08);
}

/* Header mới với menu accordion */
.app-header {
  background: var(--primary);
  padding: 12px 18px;
  padding-top: max(12px, env(safe-area-inset-top));
  border-radius: 0 0 24px 24px;
  flex-shrink: 0;
  color: white;
}
.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.header-left {
  display: flex;
  align-items: center;
  gap: 10px;
}
.avatar {
  width: 40px;
  height: 40px;
  background: rgba(255,255,255,0.2);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}
.header-title { font-weight: 800; font-size: 18px; line-height: 1.2; }
.header-sub { font-size: 11px; opacity: 0.8; }
.menu-btn {
  background: rgba(255,255,255,0.2);
  border: none;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  color: white;
  font-size: 18px;
  cursor: pointer;
  transition: 0.2s;
}
.menu-btn:active { background: rgba(255,255,255,0.4); }

/* Accordion panel */
.accordion-panel {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.35s ease-out;
  background: rgba(255,255,255,0.1);
  margin-top: 12px;
  border-radius: 20px;
  backdrop-filter: blur(4px);
}
.accordion-panel.open {
  max-height: 300px;
  transition: max-height 0.4s ease-in;
}
.panel-content {
  padding: 14px 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
}
.ctrl-group {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(0,0,0,0.2);
  padding: 6px 12px;
  border-radius: 40px;
  font-size: 12px;
}
.ctrl-group label { font-weight: 600; }
.ctrl-group input { width: 90px; cursor: pointer; }
.speed-val { font-weight: 700; min-width: 40px; }
.icon-btn {
  background: rgba(255,255,255,0.2);
  border: none;
  padding: 6px 12px;
  border-radius: 40px;
  color: white;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.icon-btn i { font-size: 12px; }

/* Topic selector - hàng ngang dễ thấy */
.topic-strip {
  padding: 8px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
}
.topic-strip::-webkit-scrollbar { display: none; }
.topic-pill {
  white-space: nowrap;
  padding: 6px 16px;
  border-radius: 40px;
  background: var(--primary-light);
  border: 1px solid var(--primary-border);
  font-size: 13px;
  font-weight: 600;
  color: var(--primary-dark);
  cursor: pointer;
}
.topic-pill.active {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}

/* Chat area - rõ ràng, dễ theo dõi */
.chat {
  flex: 1;
  overflow-y: auto;
  padding: 16px 14px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.row {
  display: flex;
}
.row.ai { justify-content: flex-start; }
.row.user { justify-content: flex-end; }
.bubble {
  max-width: 85%;
  padding: 12px 16px;
  border-radius: 20px;
  font-size: 14px;
  line-height: 1.5;
  box-shadow: 0 1px 2px rgba(0,0,0,0.05);
}
.bubble.ai {
  background: var(--ai-bg);
  border-radius: 4px 20px 20px 20px;
  border: 1px solid var(--border);
}
.bubble.user {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white;
  border-radius: 20px 4px 20px 20px;
}
.msg-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}
.role-icon {
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
}
.role-icon i { font-size: 14px; }
.ai .role-icon { color: var(--primary); }
.user .role-icon { color: rgba(255,255,255,0.9); }
.en-text {
  font-weight: 600;
  font-size: 15px;
  margin-bottom: 6px;
  word-break: break-word;
}
.vi-text {
  font-size: 13px;
  color: var(--text-light);
  border-top: 1px solid rgba(0,0,0,0.07);
  padding-top: 6px;
  margin-top: 4px;
  font-style: italic;
}
.user .vi-text {
  color: rgba(255,255,255,0.8);
  border-top-color: rgba(255,255,255,0.2);
}
.action-buttons {
  display: flex;
  gap: 12px;
  margin-top: 10px;
  justify-content: flex-end;
}
.action-btn {
  background: none;
  border: none;
  font-size: 13px;
  color: var(--primary);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 8px;
  border-radius: 30px;
  background: rgba(0,0,0,0.04);
}
.user .action-btn { color: rgba(255,255,255,0.8); background: rgba(255,255,255,0.15); }
.action-btn:active { opacity: 0.7; }

/* Loading */
.loading {
  background: var(--ai-bg);
  padding: 12px 18px;
  border-radius: 4px 20px 20px 20px;
  display: inline-flex;
  gap: 6px;
}
.dot {
  width: 8px; height: 8px; background: var(--primary); border-radius: 50%;
  animation: bounce 1.2s infinite;
}
.dot:nth-child(2) { animation-delay: .2s; }
.dot:nth-child(3) { animation-delay: .4s; }
@keyframes bounce {
  0%,100%{ transform: translateY(0); opacity: 0.4; }
  50%{ transform: translateY(-6px); opacity: 1; }
}

/* Footer input */
.input-area {
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 12px 16px;
  padding-bottom: max(18px, env(safe-area-inset-bottom));
  flex-shrink: 0;
}
.suggestion-row {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  margin-bottom: 12px;
}
.suggestion-chip {
  white-space: nowrap;
  background: var(--primary-light);
  border: 1px solid var(--primary-border);
  padding: 6px 14px;
  border-radius: 30px;
  font-size: 12px;
  font-weight: 600;
  color: var(--primary-dark);
  cursor: pointer;
}
.input-group {
  display: flex;
  gap: 10px;
  align-items: center;
}
.input-group input {
  flex: 1;
  padding: 12px 16px;
  border-radius: 30px;
  border: 1.5px solid var(--primary-border);
  background: var(--primary-light);
  font-family: inherit;
  font-size: 15px;
  outline: none;
}
.input-group input:focus { border-color: var(--primary); }
.send-btn {
  width: 46px; height: 46px;
  border-radius: 50%;
  background: var(--primary);
  border: none;
  color: white;
  font-size: 18px;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(232,84,30,0.3);
}
.send-btn:disabled { background: #ccc; box-shadow: none; cursor: default; }
.mic-area {
  margin-top: 12px;
  display: flex;
  justify-content: center;
}
.mic-button {
  width: 60px; height: 60px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  border: none;
  color: white;
  font-size: 28px;
  cursor: pointer;
  transition: 0.1s;
  box-shadow: 0 6px 20px rgba(232,84,30,0.4);
}
.mic-button.recording {
  background: linear-gradient(135deg, #ef4444, #dc2626);
  transform: scale(1.08);
  box-shadow: 0 0 0 6px rgba(239,68,68,0.3);
}
.mic-label {
  text-align: center;
  font-size: 11px;
  margin-top: 6px;
  color: var(--text-light);
  font-weight: 500;
}
.err-msg {
  background: #fee2e2;
  color: #b91c1c;
  padding: 8px 12px;
  border-radius: 12px;
  font-size: 12px;
  margin: 8px 0;
}
</style>
</head>
<body>

<!-- Setup screen -->
<div id="setup">
  <div class="setup-logo"><i class="fas fa-robot"></i></div>
  <div class="setup-title">AI English Tutor Pro</div>
  <div class="setup-sub">Nhập Gemini API Key để bắt đầu. Key được lưu cục bộ.</div>
  <div class="setup-card">
    <div class="setup-label">Gemini API Key</div>
    <input class="setup-input" id="keyInput" type="password" placeholder="AIzaSy..." autocomplete="off">
    <div class="setup-hint">Lấy key miễn phí tại <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com</a></div>
  </div>
  <div id="setupErr" class="setup-err"></div>
  <button class="btn-start" onclick="startApp()">Bắt đầu →</button>
</div>

<!-- Main app -->
<div id="app" style="display:none;">
  <div class="app-header">
    <div class="header-top">
      <div class="header-left">
        <div class="avatar"><i class="fas fa-language"></i></div>
        <div>
          <div class="header-title">AI English Tutor</div>
          <div class="header-sub">Học tiếng Anh cùng AI</div>
        </div>
      </div>
      <button class="menu-btn" id="menuToggleBtn"><i class="fas fa-sliders-h"></i></button>
    </div>
    <!-- Accordion panel chứa cài đặt -->
    <div class="accordion-panel" id="settingsPanel">
      <div class="panel-content">
        <div class="ctrl-group">
          <label><i class="fas fa-tachometer-alt"></i> Tốc độ</label>
          <input type="range" id="speedSlider" min="0.5" max="1.0" step="0.05" value="0.65">
          <span class="speed-val" id="speedValue">0.65</span>
        </div>
        <button class="icon-btn" id="themeToggle"><i class="fas fa-moon"></i> Dark</button>
        <button class="icon-btn" id="exportPdfBtn"><i class="fas fa-file-pdf"></i> PDF</button>
        <button class="icon-btn" id="resetChatBtn"><i class="fas fa-sync-alt"></i> Mới</button>
        <button class="icon-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Đổi key</button>
      </div>
    </div>
  </div>

  <!-- Topic strip -->
  <div class="topic-strip" id="topicStrip">
    <button class="topic-pill active" data-topic="general">💬 Giao tiếp</button>
    <button class="topic-pill" data-topic="travel">✈️ Du lịch</button>
    <button class="topic-pill" data-topic="interview">🎤 Phỏng vấn</button>
    <button class="topic-pill" data-topic="business">💼 Kinh doanh</button>
    <button class="topic-pill" data-topic="daily">🏠 Hàng ngày</button>
  </div>

  <!-- Chat container -->
  <div class="chat" id="chatContainer"></div>

  <!-- Input area -->
  <div class="input-area">
    <div class="suggestion-row" id="suggestionList"></div>
    <div class="input-group">
      <input type="text" id="messageInput" placeholder="Nhập câu tiếng Anh..." autocomplete="off">
      <button class="send-btn" id="sendBtn" disabled><i class="fas fa-paper-plane"></i></button>
    </div>
    <div class="mic-area">
      <button class="mic-button" id="micBtn"><i class="fas fa-microphone"></i></button>
    </div>
    <div class="mic-label" id="micStatus">Nhấn để nói</div>
  </div>
</div>

<script>
// ==================== CONFIG ====================
const GEMINI_MODEL = 'gemma-3-27b-it';  // GIỮ NGUYÊN
const GEMINI_BASE = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`;
const KEY_STORE = 'tutor_gemini_key';
const HISTORY_STORE = 'tutor_chat_history';

let API_KEY = '';
let busy = false;
let recording = false;
let recognition = null;
let messageId = 0;
let currentTopic = 'general';
let chatHistory = [];
let speechRate = 0.65;
let spkUnlock = false;

// DOM elements
const chatContainer = document.getElementById('chatContainer');
const suggestionList = document.getElementById('suggestionList');
const msgInput = document.getElementById('messageInput');
const sendBtn = document.getElementById('sendBtn');
const speedSlider = document.getElementById('speedSlider');
const speedValue = document.getElementById('speedValue');
const themeToggle = document.getElementById('themeToggle');
const exportPdfBtn = document.getElementById('exportPdfBtn');
const resetChatBtn = document.getElementById('resetChatBtn');
const logoutBtn = document.getElementById('logoutBtn');
const micBtn = document.getElementById('micBtn');
const micStatus = document.getElementById('micStatus');
const menuToggleBtn = document.getElementById('menuToggleBtn');
const settingsPanel = document.getElementById('settingsPanel');

// ==================== SPEED ====================
speedSlider.addEventListener('input', (e) => {
  speechRate = parseFloat(e.target.value);
  speedValue.textContent = speechRate.toFixed(2);
});
function getSpeechRate() { return speechRate; }

// ==================== MENU ACCORDION ====================
menuToggleBtn.addEventListener('click', () => {
  settingsPanel.classList.toggle('open');
});

// ==================== DARK MODE ====================
function initDarkMode() {
  const saved = localStorage.getItem('darkMode');
  if (saved === 'true') document.body.classList.add('dark');
  updateThemeIcon();
}
function updateThemeIcon() {
  const isDark = document.body.classList.contains('dark');
  themeToggle.innerHTML = isDark ? '<i class="fas fa-sun"></i> Light' : '<i class="fas fa-moon"></i> Dark';
}
themeToggle.addEventListener('click', () => {
  document.body.classList.toggle('dark');
  localStorage.setItem('darkMode', document.body.classList.contains('dark'));
  updateThemeIcon();
});

// ==================== EXPORT PDF ====================
async function exportToPDF() {
  if (chatHistory.length === 0) { showError('Chưa có hội thoại nào.'); return; }
  await loadJSPDF();
  const { jsPDF } = window.jspdf;
  if (!jsPDF) { showError('Không thể tạo PDF.'); return; }
  const doc = new jsPDF();
  let y = 20;
  doc.setFontSize(16);
  doc.text('AI English Tutor - Lịch sử hội thoại', 20, y);
  y += 10;
  doc.setFontSize(10);
  doc.text(`Ngày: ${new Date().toLocaleString()} | Chủ đề: ${currentTopic}`, 20, y);
  y += 10;
  for (const msg of chatHistory) {
    if (y > 270) { doc.addPage(); y = 20; }
    const prefix = msg.role === 'ai' ? '🤖 Tutor: ' : '👤 Bạn: ';
    const lines = doc.splitTextToSize(prefix + msg.en, 170);
    doc.text(lines, 20, y);
    y += lines.length * 5;
    if (msg.vi && msg.role === 'ai') {
      const viLines = doc.splitTextToSize(`  (${msg.vi})`, 170);
      doc.text(viLines, 20, y);
      y += viLines.length * 4;
    }
    y += 4;
  }
  doc.save(`english_tutor_${Date.now()}.pdf`);
}
function loadJSPDF() {
  if (window.jspdf) return Promise.resolve();
  return new Promise((resolve) => {
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    script.onload = () => resolve();
    document.head.appendChild(script);
  });
}
exportPdfBtn.addEventListener('click', exportToPDF);

// ==================== SETUP ====================
function startApp() {
  const key = document.getElementById('keyInput').value.trim();
  if (!key.startsWith('AIza') || key.length < 30) {
    showSetupErr('Key không hợp lệ (phải bắt đầu bằng AIza...).');
    return;
  }
  API_KEY = key;
  localStorage.setItem(KEY_STORE, key);
  document.getElementById('setup').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  initChat();
  loadHistory();
}
function showSetupErr(msg) {
  const el = document.getElementById('setupErr');
  el.textContent = msg; el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 5000);
}
function logout() {
  window.speechSynthesis?.cancel();
  stopRecording();
  localStorage.removeItem(KEY_STORE);
  API_KEY = '';
  document.getElementById('app').style.display = 'none';
  document.getElementById('setup').style.display = 'flex';
  document.getElementById('keyInput').value = '';
}
logoutBtn.addEventListener('click', logout);
resetChatBtn.addEventListener('click', () => resetChat());

window.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem(KEY_STORE);
  if (saved) {
    API_KEY = saved;
    document.getElementById('keyInput').value = saved;
    document.getElementById('setup').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    initChat();
    loadHistory();
  }
  initDarkMode();
  document.getElementById('keyInput').addEventListener('keydown', e => { if (e.key === 'Enter') startApp(); });
});

// Topic selection
document.querySelectorAll('.topic-pill').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.topic-pill').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTopic = btn.dataset.topic;
    addSystemMessage(`📚 Chuyển sang chủ đề: ${btn.innerText}. Hãy trò chuyện theo chủ đề này.`);
  });
});

function addSystemMessage(msg) {
  addMessage('ai', { en: msg, vi: '' }, false);
}

// ==================== CHAT CORE ====================
function initChat() {
  chatContainer.innerHTML = '';
  messageId = 0;
  busy = false;
  chatHistory = [];
  const welcomeEn = `Hello! I'm your AI English tutor. Let's practice ${currentTopic} topic. How are you today?`;
  const welcomeVi = `Xin chào! Tôi là gia sư AI. Hôm nay bạn thế nào? Chủ đề: ${currentTopic}.`;
  addMessage('ai', { en: welcomeEn, vi: welcomeVi });
  updateSuggestionButtons(["I'm fine, thanks!", "Not bad, and you?"]);
  msgInput.addEventListener('input', () => { sendBtn.disabled = !msgInput.value.trim() || busy; });
  msgInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
  msgInput.addEventListener('focus', unlockSpeech);
}
function unlockSpeech() {
  if (spkUnlock || !window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance('');
  u.volume = 0;
  window.speechSynthesis.speak(u);
  spkUnlock = true;
}
function speakText(txt) {
  if (!txt || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  setTimeout(() => {
    const utterance = new SpeechSynthesisUtterance(txt);
    utterance.lang = 'en-US';
    utterance.rate = getSpeechRate();
    window.speechSynthesis.speak(utterance);
  }, 80);
}

// ==================== GEMINI API ====================
async function callGemini(userMsg) {
  const prompt = `You are a friendly English tutor for Vietnamese learners. Topic: ${currentTopic}. Keep replies short (1-3 sentences).
Return ONLY a raw JSON object, no markdown:
{"en":"<English reply>","vi":"<Vietnamese translation>","sug":["<suggestion1>","<suggestion2>"]}
Student: ${userMsg}`;
  const res = await fetch(`${GEMINI_BASE}?key=${API_KEY}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: [{ parts: [{ text: prompt }] }],
      generationConfig: { temperature: 0.7, maxOutputTokens: 400 }
    })
  });
  if (!res.ok) {
    const errData = await res.json().catch(() => ({}));
    let msg = errData?.error?.message || `HTTP ${res.status}`;
    if (res.status === 403 || res.status === 401) throw new Error('API key không hợp lệ hoặc model không khả dụng.');
    if (res.status === 429) throw new Error('Hết quota dùng thử (429). Hãy thử key khác hoặc đợi.');
    throw new Error(msg);
  }
  const data = await res.json();
  let raw = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
  raw = raw.replace(/```json\s*/gi, '').replace(/```/g, '').trim();
  const match = raw.match(/\{[\s\S]*\}/);
  if (!match) throw new Error('AI trả về sai định dạng');
  return JSON.parse(match[0]);
}

async function sendMessage() {
  const text = msgInput.value.trim();
  if (!text || busy) return;
  unlockSpeech();
  msgInput.value = '';
  sendBtn.disabled = true;
  setBusy(true);
  removeErrorDisplay();
  addMessage('user', { en: text });
  const loadingId = showLoading();
  try {
    const response = await callGemini(text);
    removeLoading(loadingId);
    addMessage('ai', { en: response.en, vi: response.vi });
    if (response.sug && response.sug.length) updateSuggestionButtons(response.sug);
    speakText(response.en);
  } catch (err) {
    removeLoading(loadingId);
    let errMsg = err.message;
    if (errMsg.includes('quota') || errMsg.includes('429')) errMsg = '⚠️ Hết quota dùng thử. Vui lòng tạo key mới hoặc đợi.';
    else if (errMsg.includes('API key')) errMsg = '🔑 Lỗi API key. Hãy logout và nhập lại key hợp lệ.';
    showError(errMsg);
  } finally {
    setBusy(false);
  }
}

// ==================== UI HELPERS ====================
function addMessage(role, data, saveToHistory = true) {
  const msgDiv = document.createElement('div');
  msgDiv.className = `row ${role}`;
  const enText = data.en || '';
  const viText = data.vi || '';
  const actionButtons = role === 'ai' ? `
    <div class="action-buttons">
      <button class="action-btn" onclick="speakText('${escapeHtml(enText)}')"><i class="fas fa-volume-up"></i> Nghe</button>
      <button class="action-btn" onclick="practicePronunciation('${escapeHtml(enText)}')"><i class="fas fa-microphone-alt"></i> Luyện phát âm</button>
    </div>
  ` : '';
  msgDiv.innerHTML = `
    <div class="bubble ${role}">
      <div class="msg-header">
        <span class="role-icon"><i class="${role === 'ai' ? 'fas fa-robot' : 'fas fa-user'}"></i> ${role === 'ai' ? 'Trợ lý' : 'Bạn'}</span>
      </div>
      <div class="en-text">${escapeHtml(enText)}</div>
      ${viText ? `<div class="vi-text">${escapeHtml(viText)}</div>` : ''}
      ${actionButtons}
    </div>
  `;
  chatContainer.appendChild(msgDiv);
  scrollToBottom();
  if (saveToHistory && role !== 'system' && enText) {
    chatHistory.push({ role, en: enText, vi: viText, timestamp: Date.now() });
    localStorage.setItem(HISTORY_STORE, JSON.stringify(chatHistory));
  }
}
function escapeHtml(str) { return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function showLoading() {
  const id = 'loading_' + Date.now();
  const div = document.createElement('div');
  div.className = 'row ai';
  div.id = id;
  div.innerHTML = `<div class="loading"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
  chatContainer.appendChild(div);
  scrollToBottom();
  return id;
}
function removeLoading(id) { document.getElementById(id)?.remove(); }
function showError(msg) {
  const errDiv = document.createElement('div');
  errDiv.className = 'err-msg';
  errDiv.innerText = msg;
  chatContainer.appendChild(errDiv);
  scrollToBottom();
  setTimeout(() => errDiv.remove(), 6000);
}
function removeErrorDisplay() { /* just placeholder */ }
function updateSuggestionButtons(suggestions) {
  suggestionList.innerHTML = '';
  suggestions.forEach(sug => {
    const chip = document.createElement('button');
    chip.className = 'suggestion-chip';
    chip.textContent = sug;
    chip.onclick = () => { msgInput.value = sug; sendMessage(); };
    suggestionList.appendChild(chip);
  });
}
function setBusy(state) {
  busy = state;
  sendBtn.disabled = state || !msgInput.value.trim();
  document.querySelectorAll('.suggestion-chip').forEach(ch => ch.disabled = state);
}
function scrollToBottom() { requestAnimationFrame(() => chatContainer.scrollTop = chatContainer.scrollHeight); }
function resetChat() {
  window.speechSynthesis?.cancel();
  stopRecording();
  initChat();
  chatHistory = [];
  localStorage.removeItem(HISTORY_STORE);
}
function loadHistory() {
  const saved = localStorage.getItem(HISTORY_STORE);
  if (saved) {
    try {
      const old = JSON.parse(saved);
      if (old.length > 0) {
        chatHistory = old;
        chatContainer.innerHTML = '';
        old.forEach(msg => addMessage(msg.role, { en: msg.en, vi: msg.vi }, false));
        scrollToBottom();
      }
    } catch(e) {}
  }
}

// ==================== PRONUNCIATION ====================
window.practicePronunciation = function(sentence) {
  if (!window.SpeechRecognition && !window.webkitSpeechRecognition) {
    showError('Trình duyệt không hỗ trợ nhận dạng giọng nói.');
    return;
  }
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const recog = new SpeechRecognition();
  recog.lang = 'en-US';
  recog.interimResults = false;
  showError(`🎤 Hãy đọc: "${sentence}"`);
  recog.start();
  recog.onresult = (event) => {
    const spoken = event.results[0][0].transcript.toLowerCase();
    const expected = sentence.toLowerCase().replace(/[^\w\s]/g, '');
    const spokenNorm = spoken.replace(/[^\w\s]/g, '');
    const expectedWords = expected.split(/\s+/);
    const spokenWords = spokenNorm.split(/\s+/);
    const common = expectedWords.filter(w => spokenWords.includes(w)).length;
    const score = Math.round((common / expectedWords.length) * 100);
    let feedback = score >= 80 ? `Tuyệt vời! Độ chính xác ${score}% 🎉` : (score >= 50 ? `Khá tốt! ${score}% chính xác.` : `Cần luyện thêm. Độ chính xác ${score}%.`);
    showError(feedback);
    speakText(sentence);
  };
  recog.onerror = () => showError('Không nhận diện được giọng nói.');
};
window.speakText = speakText;

// ==================== MICROPHONE ====================
function stopRecording() {
  if (recognition) {
    try { recognition.abort(); } catch(e) {}
    recognition = null;
  }
  recording = false;
  micBtn.classList.remove('recording');
  micStatus.textContent = 'Nhấn để nói';
}
function toggleMicrophone() {
  unlockSpeech();
  if (recording) { stopRecording(); return; }
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) { showError('Trình duyệt không hỗ trợ mic.'); return; }
  recognition = new SpeechRecognition();
  recognition.lang = 'en-US';
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.onstart = () => {
    recording = true;
    micBtn.classList.add('recording');
    micStatus.textContent = '🎙️ Đang nghe...';
  };
  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    if (transcript.trim()) {
      msgInput.value = transcript;
      sendMessage();
    } else showError('Không nhận diện được.');
    stopRecording();
  };
  recognition.onerror = (event) => {
    showError(`Lỗi mic: ${event.error}`);
    stopRecording();
  };
  recognition.onend = () => stopRecording();
  recognition.start();
}
micBtn.addEventListener('click', toggleMicrophone);
window.sendMessage = sendMessage;
window.sendMessage = sendMessage; // export
