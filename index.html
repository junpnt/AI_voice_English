<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>English Voice Tutor - iPhone Ultra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- React ổn định nhất cho Mobile -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.22.20/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fafafa; }
        .chat-container { height: calc(100vh - 270px); overflow-y: auto; padding: 20px; }
        .user-msg { background-color: #f97316; color: white; border-bottom-right-radius: 4px; }
        .ai-msg { background-color: white; color: #1f2937; border: 1px solid #e5e7eb; border-bottom-left-radius: 4px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // API KEY CỦA BẠN (ĐÃ DÁN SẴN)
        const KEY = "AIzaSyBMox0NFLIN1xZtPJbcqoT2YeCeFAoMh30";

        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [messages, setMessages] = useState([
                { id: 1, role: 'ai', text: "Hello! Ready to speak English?", vi: "Chào bạn! Sẵn sàng nói tiếng Anh chưa?" }
            ]);
            const [isMic, setIsMic] = useState(false);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [suggs, setSuggs] = useState(["I'm ready!", "How are you?"]);
            const endRef = useRef(null);

            useEffect(() => { 
                endRef.current?.scrollIntoView({ behavior: "smooth" });
                if(window.lucide) window.lucide.createIcons();
            }, [messages]);

            const speakText = (txt) => {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(txt);
                u.lang = 'en-US'; u.rate = 0.8;
                window.speechSynthesis.speak(u);
            };

            const callGemini = async (input) => {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${KEY}`;
                
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `English tutor role. Reply to: "${input}". Output JSON only: {"en": "reply", "vi": "dịch", "suggs": ["option1", "option2"]}` }] }]
                        })
                    });

                    if (!response.ok) {
                        const status = response.status;
                        if(status === 403) throw new Error("API Key của bạn không có quyền hoặc hết hạn.");
                        throw new Error(`Server báo lỗi: ${status}`);
                    }

                    const data = await response.json();
                    let raw = data.candidates[0].content.parts[0].text;
                    raw = raw.replace(/```json/g, "").replace(/```/g, "").trim();
                    return JSON.parse(raw);
                } catch (e) {
                    throw new Error("Lỗi mạng: " + e.message);
                }
            };

            const handleSend = async (val) => {
                if (!val.trim() || loading) return;
                const userMsg = { id: Date.now(), role: 'user', text: val };
                setMessages(prev => [...prev, userMsg]);
                setLoading(true); setError(null);

                try {
                    const res = await callGemini(val);
                    const aiMsg = { id: Date.now()+1, role: 'ai', text: res.en, vi: res.vi };
                    setMessages(prev => [...prev, aiMsg]);
                    if (res.suggs) setSuggs(res.suggs);
                    speakText(res.en);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            const toggleMic = () => {
                const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!Rec) return alert("Vui lòng dùng Safari!");

                const rec = new Rec();
                rec.lang = 'en-US';
                rec.onstart = () => setIsMic(true);
                rec.onresult = (e) => {
                    const t = e.results[0][0].transcript;
                    if (e.results[0].isFinal) handleSend(t);
                };
                rec.onerror = (e) => setIsMic(false);
                rec.onend = () => setIsMic(false);
                rec.start();
            };

            return (
                <div className="flex flex-col h-screen max-w-lg mx-auto bg-white border-x">
                    <header className="p-4 bg-orange-500 text-white flex justify-between items-center shadow-lg">
                        <div className="flex items-center gap-2">
                            <i data-lucide="mic-2" className="w-6 h-6"></i>
                            <h1 className="font-bold">AI Tutor</h1>
                        </div>
                        <button onClick={() => window.location.reload()}><i data-lucide="refresh-cw" className="w-5 h-5"></i></button>
                    </header>

                    <div className="flex-1 overflow-y-auto chat-container space-y-4">
                        {messages.map(m => (
                            <div key={m.id} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`p-4 rounded-2xl max-w-[85%] shadow-sm ${m.role === 'user' ? 'user-msg' : 'ai-msg'}`}>
                                    <p className="text-[15px] font-medium leading-relaxed">{m.text}</p>
                                    {m.vi && <p className="text-xs mt-2 opacity-60 border-t pt-1 italic">{m.vi}</p>}
                                </div>
                            </div>
                        ))}
                        {loading && <div className="text-[11px] text-gray-400 italic">Thinking...</div>}
                        {error && <div className="p-3 bg-red-100 text-red-600 rounded-xl text-[11px] font-bold">{error}</div>}
                        <div ref={endRef} />
                    </div>

                    <footer className="p-4 bg-white border-t space-y-4">
                        <div className="flex gap-2 overflow-x-auto no-scrollbar py-1">
                            {suggs.map((s, i) => (
                                <button key={i} onClick={() => handleSend(s)} className="whitespace-nowrap text-[12px] py-2 px-4 bg-orange-50 text-orange-600 border border-orange-200 rounded-full active:bg-orange-200 font-semibold">
                                    {s}
                                </button>
                            ))}
                        </div>
                        <div className="flex justify-center pb-6">
                            <button onClick={toggleMic} className={`w-16 h-16 rounded-full flex items-center justify-center shadow-xl transition-all ${isMic ? 'bg-red-500 scale-110' : 'bg-orange-500'}`}>
                                <i data-lucide={isMic ? "square" : "mic"} className="text-white w-7 h-7"></i>
                            </button>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
