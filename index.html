<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>AI English Tutor - Học cùng AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --primary: #e8541e;
  --primary-dark: #bf3d0e;
  --primary-light: #fff0eb;
  --primary-border: #ffd5c2;
  --bg: #faf9f7;
  --surface: #ffffff;
  --border: #f0ede8;
  --text: #1a1512;
  --text-light: #8a7d74;
  --ai-bg: #f5f3f0;
  --success: #10b981;
  --error: #ef4444;
}

body.dark {
  --bg: #121212;
  --surface: #1e1e1e;
  --border: #2c2c2c;
  --text: #ededed;
  --text-light: #a0a0a0;
  --ai-bg: #2a2a2a;
  --primary-light: #2c1a12;
  --primary-border: #5c2a14;
}

body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg);
  height: 100dvh;
  overflow: hidden;
  color: var(--text);
  transition: background 0.2s;
}

/* Setup screen */
#setup {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 100;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  gap: 16px;
}
.setup-logo {
  width: 60px; height: 60px; border-radius: 18px; background: var(--primary);
  display: flex; align-items: center; justify-content: center; color: white; font-size: 26px;
}
.setup-title { font-size: 22px; font-weight: 800; text-align: center; }
.setup-sub { font-size: 13px; color: var(--text-light); text-align: center; max-width: 280px; }
.setup-card { width: 100%; max-width: 340px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 16px; }
.setup-label { font-size: 11px; font-weight: 700; margin-bottom: 6px; }
.setup-input { width: 100%; padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--primary-border); background: var(--primary-light); font-family: inherit; font-size: 14px; outline: none; }
.setup-input:focus { border-color: var(--primary); }
.setup-hint { font-size: 10px; margin-top: 6px; color: var(--text-light); }
.setup-hint a { color: var(--primary); text-decoration: none; }
.btn-start { width: 100%; max-width: 340px; padding: 12px; border-radius: 40px; border: none; background: var(--primary); color: white; font-weight: 800; cursor: pointer; box-shadow: 0 4px 14px rgba(232,84,30,0.3); }
.setup-err { background: #fef2f2; color: var(--error); padding: 6px 12px; border-radius: 10px; font-size: 12px; display: none; }

/* Main app */
#app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 600px;
  margin: 0 auto;
  background: var(--surface);
}

/* Header gọn */
.app-header {
  background: var(--primary);
  padding: 6px 14px;
  padding-top: max(6px, env(safe-area-inset-top));
  flex-shrink: 0;
}
.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.header-left {
  display: flex;
  align-items: center;
  gap: 8px;
}
.avatar {
  width: 32px; height: 32px;
  background: rgba(255,255,255,0.2);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  color: white;
}
.header-title { font-weight: 800; font-size: 15px; color: white; line-height: 1.2; }
.header-sub { font-size: 9px; opacity: 0.8; color: white; }
.menu-btn {
  background: rgba(255,255,255,0.2);
  border: none;
  width: 32px; height: 32px;
  border-radius: 50%;
  color: white;
  font-size: 14px;
  cursor: pointer;
}
.accordion-panel {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease-out;
}
.accordion-panel.open {
  max-height: 160px;
}
.panel-content {
  padding: 8px 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  justify-content: space-between;
  background: rgba(0,0,0,0.08);
  border-radius: 18px;
  margin-top: 6px;
}
.ctrl-group {
  display: flex;
  align-items: center;
  gap: 4px;
  background: rgba(255,255,255,0.2);
  padding: 3px 8px;
  border-radius: 30px;
  font-size: 10px;
  color: white;
}
.ctrl-group input { width: 70px; }
.icon-btn {
  background: rgba(255,255,255,0.2);
  border: none;
  padding: 4px 8px;
  border-radius: 30px;
  color: white;
  font-size: 10px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 3px;
}

/* Topic strip mỏng */
.topic-strip {
  padding: 5px 12px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 5px;
  overflow-x: auto;
  scrollbar-width: none;
  flex-shrink: 0;
}
.topic-pill {
  white-space: nowrap;
  padding: 3px 12px;
  border-radius: 30px;
  background: var(--primary-light);
  border: 1px solid var(--primary-border);
  font-size: 11px;
  font-weight: 600;
  color: var(--primary-dark);
  cursor: pointer;
}
.topic-pill.active {
  background: var(--primary);
  color: white;
}

/* CHAT - chiếm tối đa */
.chat {
  flex: 1;
  overflow-y: auto;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.row {
  display: flex;
}
.row.ai { justify-content: flex-start; }
.row.user { justify-content: flex-end; }
.bubble {
  max-width: 88%;
  padding: 8px 12px;
  border-radius: 18px;
  font-size: 13px;
  line-height: 1.45;
  word-wrap: break-word;
  white-space: normal;
}
.bubble.ai {
  background: var(--ai-bg);
  border-radius: 4px 18px 18px 18px;
  border: 1px solid var(--border);
}
.bubble.user {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white;
  border-radius: 18px 4px 18px 18px;
}
.msg-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 3px;
  font-size: 10px;
  font-weight: 600;
}
.en-text {
  font-weight: 600;
  font-size: 14px;
  margin-bottom: 3px;
  word-break: break-word;
}
.vi-text {
  font-size: 11px;
  color: var(--text-light);
  border-top: 1px solid rgba(0,0,0,0.08);
  padding-top: 4px;
  margin-top: 3px;
  font-style: italic;
}
.user .vi-text {
  color: rgba(255,255,255,0.75);
  border-top-color: rgba(255,255,255,0.2);
}
.action-buttons {
  display: flex;
  gap: 10px;
  margin-top: 6px;
  justify-content: flex-end;
}
.action-btn {
  background: none;
  border: none;
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 20px;
  background: rgba(0,0,0,0.05);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 3px;
}
.user .action-btn { background: rgba(255,255,255,0.15); color: white; }
.loading {
  background: var(--ai-bg);
  padding: 8px 14px;
  border-radius: 4px 18px 18px 18px;
  display: inline-flex;
  gap: 4px;
}
.dot {
  width: 6px; height: 6px; background: var(--primary); border-radius: 50%;
  animation: bounce 1.2s infinite;
}
.dot:nth-child(2) { animation-delay: .2s; }
.dot:nth-child(3) { animation-delay: .4s; }
@keyframes bounce {
  0%,100%{ transform: translateY(0); opacity: 0.4; }
  50%{ transform: translateY(-3px); opacity: 1; }
}
.err-msg {
  background: #fee2e2;
  color: #b91c1c;
  padding: 5px 10px;
  border-radius: 10px;
  font-size: 11px;
  margin: 4px 0;
}

/* === VÙNG NHẬP LIỆU TỐI ƯU, RẤT GỌN === */
.input-area {
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 5px 10px;
  padding-bottom: max(8px, env(safe-area-inset-bottom));
  flex-shrink: 0;
}
.suggestion-row {
  display: flex;
  gap: 5px;
  overflow-x: auto;
  margin-bottom: 5px;
}
.suggestion-chip {
  white-space: nowrap;
  background: var(--primary-light);
  border: 1px solid var(--primary-border);
  padding: 3px 10px;
  border-radius: 30px;
  font-size: 10px;
  font-weight: 600;
  color: var(--primary-dark);
  cursor: pointer;
}
.input-group {
  display: flex;
  gap: 6px;
  align-items: center;
}
.input-group input {
  flex: 1;
  padding: 8px 12px;
  border-radius: 30px;
  border: 1.5px solid var(--primary-border);
  background: var(--primary-light);
  font-size: 13px;
  outline: none;
}
.send-btn {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: var(--primary);
  border: none;
  color: white;
  font-size: 14px;
  cursor: pointer;
}
.send-btn:disabled { background: #ccc; cursor: default; }
.mic-area {
  display: flex;
  justify-content: center;
  margin-top: 5px;
}
.mic-button {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  border: none;
  color: white;
  font-size: 20px;
  cursor: pointer;
}
.mic-button.recording {
  background: linear-gradient(135deg, #ef4444, #dc2626);
  transform: scale(1.02);
  box-shadow: 0 0 0 3px rgba(239,68,68,0.3);
}
.mic-label {
  text-align: center;
  font-size: 9px;
  margin-top: 2px;
  color: var(--text-light);
}
</style>
</head>
<body>

<!-- Setup -->
<div id="setup">
  <div class="setup-logo"><i class="fas fa-robot"></i></div>
  <div class="setup-title">AI English Tutor</div>
  <div class="setup-sub">Nhập Gemini API Key để bắt đầu</div>
  <div class="setup-card">
    <div class="setup-label">Gemini API Key</div>
    <input class="setup-input" id="keyInput" type="password" placeholder="AIzaSy..." autocomplete="off">
    <div class="setup-hint">Lấy key tại <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com</a></div>
  </div>
  <div id="setupErr" class="setup-err"></div>
  <button class="btn-start" onclick="startApp()">Bắt đầu →</button>
</div>

<!-- Main App -->
<div id="app" style="display:none;">
  <div class="app-header">
    <div class="header-top">
      <div class="header-left">
        <div class="avatar"><i class="fas fa-graduation-cap"></i></div>
        <div>
          <div class="header-title">AI Tutor</div>
          <div class="header-sub">Luyện tiếng Anh</div>
        </div>
      </div>
      <button class="menu-btn" id="menuToggle"><i class="fas fa-sliders-h"></i></button>
    </div>
    <div class="accordion-panel" id="settingsPanel">
      <div class="panel-content">
        <div class="ctrl-group"><label><i class="fas fa-tachometer-alt"></i> Tốc độ</label><input type="range" id="speedSlider" min="0.5" max="1.0" step="0.05" value="0.65"><span id="speedVal" style="min-width:32px;">0.65</span></div>
        <button class="icon-btn" id="themeToggle"><i class="fas fa-moon"></i> Dark</button>
        <button class="icon-btn" id="exportPDF"><i class="fas fa-file-pdf"></i> PDF</button>
        <button class="icon-btn" id="resetChat"><i class="fas fa-sync-alt"></i> Mới</button>
        <button class="icon-btn" id="logoutApp"><i class="fas fa-sign-out-alt"></i> Key</button>
      </div>
    </div>
  </div>

  <div class="topic-strip" id="topicStrip">
    <button class="topic-pill active" data-topic="general">💬 Giao tiếp</button>
    <button class="topic-pill" data-topic="travel">✈️ Du lịch</button>
    <button class="topic-pill" data-topic="interview">🎤 Phỏng vấn</button>
    <button class="topic-pill" data-topic="business">💼 Kinh doanh</button>
    <button class="topic-pill" data-topic="daily">🏠 Hàng ngày</button>
  </div>

  <div class="chat" id="chatArea"></div>

  <div class="input-area">
    <div class="suggestion-row" id="suggestionRow"></div>
    <div class="input-group">
      <input type="text" id="textInput" placeholder="Gõ câu tiếng Anh..." autocomplete="off">
      <button class="send-btn" id="sendBtn" disabled><i class="fas fa-paper-plane"></i></button>
    </div>
    <div class="mic-area">
      <button class="mic-button" id="micBtn"><i class="fas fa-microphone"></i></button>
    </div>
    <div class="mic-label" id="micStatusLabel">Nhấn mic để nói</div>
  </div>
</div>

<script>
// ==================== CONFIG ====================
const GEMINI_MODEL = 'gemma-3-27b-it';  // giữ nguyên model
const GEMINI_BASE = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`;
const KEY_STORE = 'tutor_gemini_key';
const HISTORY_STORE = 'tutor_chat_history';

let API_KEY = '';
let busy = false;
let recording = false;
let recognition = null;
let currentTopic = 'general';
let chatHistory = [];
let speechRate = 0.65;
let spkUnlock = false;
let msgId = 0;

// DOM
const chatArea = document.getElementById('chatArea');
const suggestionRow = document.getElementById('suggestionRow');
const textInput = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');
const speedSlider = document.getElementById('speedSlider');
const speedVal = document.getElementById('speedVal');
const themeToggle = document.getElementById('themeToggle');
const exportPDF = document.getElementById('exportPDF');
const resetChatBtn = document.getElementById('resetChat');
const logoutApp = document.getElementById('logoutApp');
const micBtn = document.getElementById('micBtn');
const micStatusLabel = document.getElementById('micStatusLabel');
const menuToggle = document.getElementById('menuToggle');
const settingsPanel = document.getElementById('settingsPanel');

// ==================== SPEED ====================
speedSlider.addEventListener('input', () => {
  speechRate = parseFloat(speedSlider.value);
  speedVal.innerText = speechRate.toFixed(2);
});
function getSpeechRate() { return speechRate; }

// ==================== MENU ====================
menuToggle.addEventListener('click', () => settingsPanel.classList.toggle('open'));

// ==================== DARK MODE ====================
function initDarkMode() {
  if (localStorage.getItem('darkMode') === 'true') document.body.classList.add('dark');
  updateThemeIcon();
}
function updateThemeIcon() {
  const isDark = document.body.classList.contains('dark');
  themeToggle.innerHTML = isDark ? '<i class="fas fa-sun"></i> Light' : '<i class="fas fa-moon"></i> Dark';
}
themeToggle.addEventListener('click', () => {
  document.body.classList.toggle('dark');
  localStorage.setItem('darkMode', document.body.classList.contains('dark'));
  updateThemeIcon();
});

// ==================== PDF EXPORT ====================
async function exportToPdf() {
  if (chatHistory.length === 0) { showError('Chưa có hội thoại.'); return; }
  await loadJSPDF();
  const { jsPDF } = window.jspdf;
  if (!jsPDF) { showError('Không thể tạo PDF.'); return; }
  const doc = new jsPDF();
  let y = 20;
  doc.setFontSize(16);
  doc.text('AI English Tutor - Conversation', 20, y);
  y += 10;
  doc.setFontSize(10);
  doc.text(`Date: ${new Date().toLocaleString()} | Topic: ${currentTopic}`, 20, y);
  y += 10;
  for (const msg of chatHistory) {
    if (y > 270) { doc.addPage(); y = 20; }
    const prefix = msg.role === 'ai' ? '🤖 Tutor: ' : '👤 You: ';
    const lines = doc.splitTextToSize(prefix + msg.en, 170);
    doc.text(lines, 20, y);
    y += lines.length * 5;
    if (msg.vi && msg.role === 'ai') {
      const viLines = doc.splitTextToSize(`  (${msg.vi})`, 170);
      doc.text(viLines, 20, y);
      y += viLines.length * 4;
    }
    y += 4;
  }
  doc.save(`english_tutor_${Date.now()}.pdf`);
}
function loadJSPDF() {
  if (window.jspdf) return Promise.resolve();
  return new Promise((resolve) => {
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    script.onload = () => resolve();
    document.head.appendChild(script);
  });
}
exportPDF.addEventListener('click', exportToPdf);

// ==================== SETUP ====================
function startApp() {
  const key = document.getElementById('keyInput').value.trim();
  if (!key.startsWith('AIza') || key.length < 30) {
    document.getElementById('setupErr').style.display = 'block';
    document.getElementById('setupErr').innerText = 'Key không hợp lệ.';
    return;
  }
  API_KEY = key;
  localStorage.setItem(KEY_STORE, key);
  document.getElementById('setup').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  initChat();
  loadHistory();
}
function logout() {
  window.speechSynthesis?.cancel();
  stopRecording();
  localStorage.removeItem(KEY_STORE);
  API_KEY = '';
  document.getElementById('app').style.display = 'none';
  document.getElementById('setup').style.display = 'flex';
  document.getElementById('keyInput').value = '';
}
logoutApp.addEventListener('click', logout);
resetChatBtn.addEventListener('click', () => resetChat());

window.addEventListener('DOMContentLoaded', () => {
  const savedKey = localStorage.getItem(KEY_STORE);
  if (savedKey) {
    API_KEY = savedKey;
    document.getElementById('keyInput').value = savedKey;
    document.getElementById('setup').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    initChat();
    loadHistory();
  }
  initDarkMode();
  document.getElementById('keyInput').addEventListener('keydown', e => { if (e.key === 'Enter') startApp(); });
});

// Topic
document.querySelectorAll('.topic-pill').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.topic-pill').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTopic = btn.dataset.topic;
    addSystemMessage(`📚 Chủ đề: ${btn.innerText}. Hãy bắt đầu nào!`);
  });
});
function addSystemMessage(msg) {
  addMessage('ai', { en: msg, vi: '' }, false);
}

// ==================== CHAT ====================
function initChat() {
  chatArea.innerHTML = '';
  busy = false;
  chatHistory = [];
  addMessage('ai', {
    en: `Hello! I'm your AI English tutor. Let's practice ${currentTopic}. How are you today?`,
    vi: `Xin chào! Tôi là gia sư AI. Hôm nay bạn thế nào? Chủ đề: ${currentTopic}.`
  });
  updateSuggestions(["I'm fine, thanks!", "Not bad, and you?"]);
  textInput.value = '';
  textInput.addEventListener('input', () => { sendBtn.disabled = !textInput.value.trim() || busy; });
  textInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
  textInput.addEventListener('focus', unlockSpeech);
}
function unlockSpeech() {
  if (spkUnlock || !window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance('');
  u.volume = 0;
  window.speechSynthesis.speak(u);
  spkUnlock = true;
}
function speakText(txt) {
  if (!txt || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  setTimeout(() => {
    const utterance = new SpeechSynthesisUtterance(txt);
    utterance.lang = 'en-US';
    utterance.rate = getSpeechRate();
    window.speechSynthesis.speak(utterance);
  }, 50);
}

// ==================== GEMINI API ====================
async function callGemini(userMsg) {
  const prompt = `You are a friendly English tutor for Vietnamese learners. Topic: ${currentTopic}. Keep replies short (1-3 sentences).
Return ONLY a raw JSON object, no markdown:
{"en":"<English reply>","vi":"<Vietnamese translation>","sug":["<suggestion1>","<suggestion2>"]}
Student: ${userMsg}`;
  const res = await fetch(`${GEMINI_BASE}?key=${API_KEY}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: [{ parts: [{ text: prompt }] }],
      generationConfig: { temperature: 0.7, maxOutputTokens: 400 }
    })
  });
  if (!res.ok) {
    const errData = await res.json().catch(() => ({}));
    if (res.status === 429) throw new Error('Hết quota dùng thử (429). Đợi hoặc tạo key mới.');
    if (res.status === 403 || res.status === 401) throw new Error('API key không hợp lệ.');
    throw new Error(errData?.error?.message || `Lỗi ${res.status}`);
  }
  const data = await res.json();
  let raw = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
  raw = raw.replace(/```json\s*/gi, '').replace(/```/g, '').trim();
  const match = raw.match(/\{[\s\S]*\}/);
  if (!match) throw new Error('AI phản hồi sai định dạng');
  return JSON.parse(match[0]);
}

async function sendMessage() {
  const msg = textInput.value.trim();
  if (!msg || busy) return;
  unlockSpeech();
  textInput.value = '';
  sendBtn.disabled = true;
  busy = true;
  addMessage('user', { en: msg });
  const loadingId = showLoading();
  try {
    const res = await callGemini(msg);
    removeLoading(loadingId);
    addMessage('ai', { en: res.en, vi: res.vi });
    if (res.sug && res.sug.length) updateSuggestions(res.sug);
    speakText(res.en);
  } catch (err) {
    removeLoading(loadingId);
    showError(err.message);
  } finally {
    busy = false;
    sendBtn.disabled = !textInput.value.trim();
    document.querySelectorAll('.suggestion-chip').forEach(ch => ch.disabled = false);
  }
}

// ==================== UI ====================
function addMessage(role, data, save = true) {
  const div = document.createElement('div');
  div.className = `row ${role}`;
  const en = escapeHtml(data.en);
  const vi = data.vi ? `<div class="vi-text">${escapeHtml(data.vi)}</div>` : '';
  const actions = role === 'ai' ? `
    <div class="action-buttons">
      <button class="action-btn" onclick="speakText('${en.replace(/'/g, "\\'")}')"><i class="fas fa-volume-up"></i> Nghe</button>
      <button class="action-btn" onclick="practicePronunciation('${en.replace(/'/g, "\\'")}')"><i class="fas fa-microphone-alt"></i> Luyện phát âm</button>
    </div>
  ` : '';
  div.innerHTML = `
    <div class="bubble ${role}">
      <div class="msg-header"><span class="role-icon"><i class="${role === 'ai' ? 'fas fa-robot' : 'fas fa-user'}"></i> ${role === 'ai' ? 'AI Tutor' : 'Bạn'}</span></div>
      <div class="en-text">${en}</div>
      ${vi}
      ${actions}
    </div>
  `;
  chatArea.appendChild(div);
  scrollToBottom();
  if (save && role !== 'system' && en) {
    chatHistory.push({ role, en: data.en, vi: data.vi || '', timestamp: Date.now() });
    localStorage.setItem(HISTORY_STORE, JSON.stringify(chatHistory));
  }
}
function showLoading() {
  const id = 'load_' + Date.now();
  const div = document.createElement('div');
  div.className = 'row ai';
  div.id = id;
  div.innerHTML = `<div class="loading"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
  chatArea.appendChild(div);
  scrollToBottom();
  return id;
}
function removeLoading(id) { document.getElementById(id)?.remove(); }
function showError(msg) {
  const errDiv = document.createElement('div');
  errDiv.className = 'err-msg';
  errDiv.innerText = msg;
  chatArea.appendChild(errDiv);
  scrollToBottom();
  setTimeout(() => errDiv.remove(), 5000);
}
function updateSuggestions(list) {
  suggestionRow.innerHTML = '';
  list.forEach(s => {
    const chip = document.createElement('button');
    chip.className = 'suggestion-chip';
    chip.textContent = s;
    chip.onclick = () => { textInput.value = s; sendMessage(); };
    suggestionRow.appendChild(chip);
  });
}
function scrollToBottom() {
  setTimeout(() => chatArea.scrollTop = chatArea.scrollHeight, 50);
}
function resetChat() {
  window.speechSynthesis?.cancel();
  stopRecording();
  initChat();
  chatHistory = [];
  localStorage.removeItem(HISTORY_STORE);
}
function loadHistory() {
  const saved = localStorage.getItem(HISTORY_STORE);
  if (saved) {
    try {
      const old = JSON.parse(saved);
      if (old.length) {
        chatHistory = old;
        chatArea.innerHTML = '';
        old.forEach(msg => addMessage(msg.role, { en: msg.en, vi: msg.vi }, false));
        scrollToBottom();
      }
    } catch(e) {}
  }
}
function escapeHtml(str) { return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ==================== PRONUNCIATION ====================
window.practicePronunciation = function(sentence) {
  if (!window.SpeechRecognition && !window.webkitSpeechRecognition) {
    showError('Trình duyệt không hỗ trợ luyện phát âm.');
    return;
  }
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const recog = new SpeechRecognition();
  recog.lang = 'en-US';
  recog.interimResults = false;
  showError(`🎤 Hãy đọc: "${sentence}"`);
  recog.start();
  recog.onresult = (event) => {
    const spoken = event.results[0][0].transcript.toLowerCase();
    const expected = sentence.toLowerCase().replace(/[^\w\s]/g, '');
    const spokenNorm = spoken.replace(/[^\w\s]/g, '');
    const expWords = expected.split(/\s+/);
    const spkWords = spokenNorm.split(/\s+/);
    const matchCount = expWords.filter(w => spkWords.includes(w)).length;
    const score = Math.round((matchCount / expWords.length) * 100);
    let feedback = score >= 80 ? `Tuyệt vời! Độ chính xác ${score}% 🎉` : (score >= 50 ? `Khá tốt! ${score}%` : `Cần luyện thêm. Độ chính xác ${score}%`);
    showError(feedback);
    speakText(sentence);
  };
  recog.onerror = () => showError('Không nhận diện được giọng nói.');
};
window.speakText = speakText;

// ==================== MICROPHONE ====================
function stopRecording() {
  if (recognition) { try { recognition.abort(); } catch(e) {} recognition = null; }
  recording = false;
  micBtn.classList.remove('recording');
  micStatusLabel.innerText = 'Nhấn mic để nói';
}
function toggleMic() {
  unlockSpeech();
  if (recording) { stopRecording(); return; }
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) { showError('Trình duyệt không hỗ trợ mic.'); return; }
  recognition = new SpeechRecognition();
  recognition.lang = 'en-US';
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.onstart = () => {
    recording = true;
    micBtn.classList.add('recording');
    micStatusLabel.innerText = '🎙️ Đang nghe...';
  };
  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    if (transcript.trim()) { textInput.value = transcript; sendMessage(); }
    else showError('Không nhận diện được.');
    stopRecording();
  };
  recognition.onerror = (event) => {
    showError(`Lỗi mic: ${event.error}`);
    stopRecording();
  };
  recognition.onend = () => stopRecording();
  recognition.start();
}
micBtn.addEventListener('click', toggleMic);
window.sendMessage = sendMessage;
</script>
